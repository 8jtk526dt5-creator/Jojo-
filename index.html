<title>Jojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* Layout: arène 16:9 en haut, manette tactile dessous (portrait) ou par-dessus (paysage). Look: manga acide, aplats violet/magenta/jaune, contours épais. */
:root{
  --ink:#120a1f;
  --violet:#3b1d6e;
  --magenta:#ff2e93;
  --gold:#ffd23f;
  --cyan:#35e0ff;
  --paper:#f6ecff;
  --display:'Bangers','Impact','Arial Black',sans-serif;
  --body:'Rubik','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--paper);font-family:var(--body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px;
}
#stage{position:relative;width:100%;max-width:min(100%,calc((100vh - 200px)*1.7778));margin:6px auto 0;aspect-ratio:16/9;border:3px solid var(--gold);border-radius:6px;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--magenta)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:12px;background:rgba(18,10,31,.88)}
.overlay[hidden]{display:none!important}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,64px);letter-spacing:2px;margin:0;line-height:.95;color:var(--gold);text-shadow:3px 3px 0 var(--magenta),6px 6px 0 var(--violet);transform:skew(-6deg)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,34px);margin:0;color:var(--cyan);letter-spacing:1px}
p.sub{margin:0;font-size:clamp(11px,3vw,14px);opacity:.85;max-width:34ch;line-height:1.35}
.btn{font-family:var(--display);font-size:clamp(18px,5vw,26px);letter-spacing:1px;color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:8px;padding:8px 22px;box-shadow:4px 4px 0 var(--magenta);cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--magenta)}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(100%,420px)}
.pick button{font-family:var(--body);font-weight:700;font-size:12px;color:var(--paper);background:var(--violet);border:2px solid var(--paper);border-radius:6px;padding:8px 6px;line-height:1.25}
.pick button small{display:block;font-weight:400;opacity:.8;font-size:10px}
.pick button.on{background:var(--magenta);border-color:var(--gold)}
#pad{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.grp{display:grid;gap:8px}
#dirs{grid-template-columns:repeat(2,76px)}
#acts{grid-template-columns:repeat(3,68px);align-items:center}
.k{height:68px;border-radius:50%;border:3px solid var(--paper);background:var(--violet);color:var(--paper);font-family:var(--display);font-size:17px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}
#dirs .k{border-radius:14px;height:76px;font-size:30px}
.k.down{background:var(--magenta);transform:scale(.94)}
.k.gold{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.k.gold.down{background:var(--cyan)}
.k.dim{opacity:.35}
.k.ready{animation:pulse .6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 var(--cyan)}to{box-shadow:0 0 0 8px transparent}}
@media (orientation:landscape) and (max-height:520px){
  body{padding:0;display:block}
  #stage{max-width:none;width:auto;height:100%;margin:0 auto;border-radius:0;box-shadow:none;border-width:0}
  #pad{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:6px;padding:0;pointer-events:none}
  #pad .k{pointer-events:auto;opacity:.82}
  #dirs{grid-template-columns:repeat(2,64px)}#dirs .k{height:64px}
  #acts{grid-template-columns:repeat(3,58px)}.k{height:58px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){.k.ready{animation:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;700&display=swap">
<div id="stage">
  <canvas id="c" width="320" height="180"></canvas>
  <div class="overlay" id="menu">
    <h1>JOJO</h1>
    <p class="sub">Invoque ton Stand, enchaîne les rafales, finis le combat avec ta pose ultime.</p>
    <div class="pick" id="pick"></div>
    <button class="btn" id="go">COMBATTRE</button>
  </div>
  <div class="overlay" id="end" hidden>
    <h1 id="endT">K.O.</h1>
    <p class="sub" id="endS"></p>
    <button class="btn" id="again">CONTINUER</button>
  </div>
</div>
<div id="pad">
  <div class="grp" id="dirs">
    <div class="k" data-k="left">◀</div>
    <div class="k" data-k="right">▶</div>
  </div>
  <div class="grp" id="acts">
    <div class="k" data-k="jump">SAUT</div>
    <div class="k" data-k="hit">COUP</div>
    <div class="k" data-k="stand">STAND</div>
    <div class="k gold" data-k="ult" id="ultk" style="grid-column:1 / span 3;border-radius:34px;height:52px">POSE ULTIME</div>
  </div>
</div>
<script>
/* ===== Partie 2 : moteur pixel + sprites ===== */
const W=320,H=180,GROUND=150;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);

// rectangle miroir : ox = décalage depuis le centre dans le sens où le personnage regarde
function R(x,y,f,ox,oy,w,h,col){
  cx.fillStyle=col;
  const px=Math.round(x+f*ox-(f<0?w:0));
  cx.fillRect(px,Math.round(y+oy),w,h);
}
// pièce avec contour 1px + ombrage bas
function P(x,y,f,ox,oy,w,h,col,shade,ol){
  R(x,y,f,ox-1,oy-1,w+2,h+2,ol||'#120a1f');
  R(x,y,f,ox,oy,w,h,col);
  if(shade) R(x,y,f,ox,oy+h-Math.max(2,h>>2),w,Math.max(2,h>>2),shade);
}
function shadow(x,gy,w){
  cx.fillStyle='rgba(10,5,20,.55)';
  for(let i=0;i<4;i++){const ww=w-i*4;cx.fillRect(Math.round(x-ww/2),gy+i-1,ww,1)}
}

/* ----- palettes : combattants et Stands originaux ----- */
const FIGHTERS={
  salomon:{name:'SALOMON',stand:'TIC-TAC',skin:'#f2c29b',skinS:'#c98f6c',hair:'#1c1c3a',hairH:'#3a3a78',
    top:'#1d1b2e',topS:'#100f1c',pants:'#2a2850',pantsS:'#171633',boot:'#0d0b17',acc:'#ffd23f',
    st:{body:'#3c58d6',bodyS:'#25358a',acc:'#ffd23f',glow:'#35e0ff',skin:'#8fb0ff'},ult:'freeze',ultName:'LE TEMPS S\'ARRÊTE'},
  mirella:{name:'MIRELLA',stand:'ROSE NOIRE',skin:'#e9b48a',skinS:'#b98259',hair:'#c0295e',hairH:'#ff5c9a',
    top:'#2f7d5f',topS:'#1b4d3a',pants:'#3a2d5c',pantsS:'#221a3a',boot:'#14101f',acc:'#ffd23f',
    st:{body:'#e0407f',bodyS:'#8f1f50',acc:'#ffe7f1',glow:'#ff2e93',skin:'#ffb3d1'},ult:'beam',ultName:'RAYON ÉCARLATE'}
};
const FOES=[
  {name:'BRUTUS KANE',stand:'GRANITE',hp:90,spd:.55,dmg:7,rate:1.1,ranged:false,
   skin:'#d9a07c',skinS:'#a8704f',hair:'#3a2a1a',hairH:'#5a4126',top:'#7a2d2d',topS:'#4a1818',pants:'#4d4d57',pantsS:'#2d2d36',boot:'#1b1417',acc:'#ffd23f',
   st:{body:'#8a8f9c',bodyS:'#55596a',acc:'#c8c8d8',glow:'#ffffff',skin:'#b0b4c0'},bg:0},
  {name:'NOX VESPER',stand:'ÉCLIPSE',hp:110,spd:.8,dmg:6,rate:.8,ranged:true,
   skin:'#cfd8f0',skinS:'#98a4cc',hair:'#e8e8ff',hairH:'#ffffff',top:'#2a1d4d',topS:'#150e2e',pants:'#1c1535',pantsS:'#0f0a22',boot:'#0b0818',acc:'#35e0ff',
   st:{body:'#6a2fc0',bodyS:'#3c1880',acc:'#35e0ff',glow:'#b56cff',skin:'#c9a6ff'},bg:1},
  {name:'DOCTEUR ORAGE',stand:'FOUDRE MÈRE',hp:140,spd:.95,dmg:8,rate:.65,ranged:true,
   skin:'#eac9a8',skinS:'#b99371',hair:'#ffd23f',hairH:'#fff1a0',top:'#e8e8e8',topS:'#a9a9bd',pants:'#2b2b3d',pantsS:'#171724',boot:'#0d0d16',acc:'#ff2e93',
   st:{body:'#ffd23f',bodyS:'#b3891a',acc:'#35e0ff',glow:'#fff6a0',skin:'#fff0a8'},bg:2}
];

/* ----- humanoïde ----- */
function human(x,y,f,p,s){
  // s : {t, act, ph, bob}
  const t=s.t, walk=s.act==='walk';
  const sw=walk?Math.round(Math.sin(t*14)*3):0;
  const bob=s.act==='idle'?Math.round(Math.sin(t*4)):0;
  let lean=0;
  if(s.act==='hurt') lean=-3;
  if(s.act==='ko'){ // allongé
    cx.save();cx.translate(Math.round(x),Math.round(y));cx.rotate(-f*1.45);cx.translate(-Math.round(x),-Math.round(y)+8);
    human(x,y,f,p,{t,act:'idle'});cx.restore();return;
  }
  const by=y+bob;
  shadow(x,GROUND,26);
  // jambes
  P(x,by,f,-6+sw,-13,5,10,p.pants,p.pantsS);
  P(x,by,f,1-sw,-13,5,10,p.pants,p.pantsS);
  P(x,by,f,-7+sw,-4,6,4,p.boot);
  P(x,by,f,1-sw,-4,6,4,p.boot);
  // bras arrière
  const pose=s.act==='pose';
  P(x,by,f,pose?-9+lean:-8+lean,pose?-34:-27,4,11,p.skin,p.skinS);
  // torse
  P(x,by,f,-6+lean,-28,12,16,p.top,p.topS);
  R(x,by,f,-6+lean,-16,12,2,p.acc);
  R(x,by,f,-1+lean,-25,2,2,p.acc);
  // tête
  P(x,by,f,-4+lean,-38,9,9,p.skin,p.skinS);
  R(x,by,f,2+lean,-34,2,2,'#120a1f');
  P(x,by,f,-5+lean,-42,11,5,p.hair,p.hairH);
  R(x,by,f,-6+lean,-45,3,4,p.hair); R(x,by,f,-1+lean,-46,3,5,p.hair); R(x,by,f,3+lean,-45,3,4,p.hair);
  // bras avant
  if(s.act==='hit'){
    const ext=Math.round(8+s.ph*10);
    P(x,by,f,2,-26,ext,4,p.skin,p.skinS);
    P(x,by,f,2+ext,-27,5,6,p.skin,p.skinS);
  } else if(s.act==='block'){
    P(x,by,f,0,-36,4,12,p.skin,p.skinS);P(x,by,f,0,-37,6,4,p.skin);
  } else if(pose){
    P(x,by,f,5,-40,4,14,p.skin,p.skinS);
    P(x,by,f,5,-44,6,4,p.skin);
  } else {
    P(x,by,f,4+lean,-27,4,11,p.skin,p.skinS);
  }
}

/* ----- Stand (humanoïde élancé, lumineux) ----- */
function standSprite(x,y,f,st,s){
  const t=s.t, fl=Math.sin(t*9)*2;
  const gy=y+Math.round(Math.sin(t*3)*2);
  // aura
  cx.globalAlpha=.25;
  cx.fillStyle=st.glow;
  cx.fillRect(Math.round(x-14),Math.round(gy-56),28,56);
  cx.globalAlpha=1;
  P(x,gy,f,-5,-14,4,12,st.body,st.bodyS);P(x,gy,f,1,-14,4,12,st.body,st.bodyS);
  P(x,gy,f,-6,-3,6,3,st.acc);P(x,gy,f,0,-3,6,3,st.acc);
  P(x,gy,f,-7,-32,14,19,st.body,st.bodyS);
  R(x,gy,f,-7,-22,14,2,st.acc);
  R(x,gy,f,-2,-30,4,4,st.glow);                 // joyau
  P(x,gy,f,-4,-42,9,9,st.skin,st.bodyS);
  R(x,gy,f,-1,-39,6,3,st.glow);                 // visière
  R(x,gy,f,-5,-46,3,5,st.acc);R(x,gy,f,3,-46,3,5,st.acc);
  P(x,gy,f,-10,-31,4,10,st.body,st.bodyS);      // épaulière arrière
  if(s.atk){
    for(let i=0;i<4;i++){
      const o=Math.round(((s.ph*14+i*7)%24)),yy=-34+i*5+Math.round(Math.sin(t*40+i)*2);
      P(x,gy,f,6+o,yy,8,4,st.body,st.bodyS);
      P(x,gy,f,14+o,yy-1,5,6,st.skin,st.bodyS);
    }
  } else {
    P(x,gy,f,6,-30+Math.round(fl),4,12,st.body,st.bodyS);P(x,gy,f,5,-19+Math.round(fl),6,5,st.skin);
  }
}

/* ----- décors ----- */
const SKY=[['#2a0d4d','#ff2e93'],['#0b1033','#6a2fc0'],['#1d0a2a','#ffd23f']];
const sky=[];
(function(){
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let L=0;L<2;L++){const a=[];let xx=-10;
    while(xx<W+40){const w=14+rnd()*26|0,h=(L?30:55)+rnd()*(L?30:45)|0;a.push([xx,w,h,rnd()]);xx+=w+(rnd()*4|0)}
    sky.push(a)}
})();
function drawBG(i,t,cam){
  const [a,b]=SKY[i];
  const g=cx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,a);g.addColorStop(1,b);
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // soleil / lune par bandes
  cx.fillStyle=i===1?'#e8e8ff':'#fff1a0';
  for(let k=0;k<8;k++){cx.fillRect(228-14+k,28+k*3,28-k*2,2)}
  // villes en 2 plans
  sky.forEach((arr,L)=>{
    cx.fillStyle=L?'#1a0d33':'#0d0620';
    arr.forEach(([bx,w,h,r])=>{
      const px=Math.round(bx-cam*(L?.12:.25));
      cx.fillRect(px,GROUND-h,w,h);
      cx.fillStyle=L?'#ffd23f':'#35e0ff';
      for(let wy=GROUND-h+4;wy<GROUND-6;wy+=7)for(let wx=px+3;wx<px+w-3;wx+=6)if(((wx*7+wy*3)|0)%5===0)cx.fillRect(wx,wy,2,3);
      cx.fillStyle=L?'#1a0d33':'#0d0620';
    });
  });
  // sol
  cx.fillStyle='#241247';cx.fillRect(0,GROUND,W,H-GROUND);
  cx.fillStyle='#3b1d6e';cx.fillRect(0,GROUND,W,2);
  cx.fillStyle='#120a1f';
  for(let k=-2;k<12;k++){const px=Math.round(k*34-(cam*1)%34);cx.fillRect(px,GROUND+2,2,H-GROUND)}
  cx.fillRect(0,GROUND+14,W,1);
}
/* ===== Partie 3 : logique de combat ===== */
const inp={left:false,right:false,jump:false,hit:false,stand:false,ult:false};
const G={mode:'menu',round:0,t:0,shake:0,msg:'',msgT:0,pose:0,poseName:'',parts:[],words:[],proj:[],won:false,picked:'salomon'};

function mk(key,foe){
  const d=foe||FIGHTERS[key];
  return {d,x:foe?250:70,y:GROUND,vy:0,f:foe?-1:1,hp:foe?foe.hp:100,max:foe?foe.hp:100,
    act:'idle',actT:0,dur:.3,ph:0,hurtT:0,hit:0,stand:false,gauge:100,ult:0,frozen:0,boost:0,
    cd:1.2,blockT:0,shoot:1.5,isFoe:!!foe,t:0,dealt:false};
}
let me,foe;

function startRound(){
  foe=mk(null,FOES[G.round]);
  me.x=70;me.y=GROUND;me.vy=0;me.f=1;me.hp=Math.min(me.max,me.hp+25);me.stand=false;me.act='idle';me.actT=0;
  G.proj=[];G.mode='intro';G.msg='MANCHE '+(G.round+1);G.msgT=1.4;G.sub=FOES[G.round].name;
}
function newGame(){me=mk(G.picked);G.round=0;startRound()}

function spark(x,y,col,n=8){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*90;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life:.35+Math.random()*.2,col})}
}
function word(x,y,col){
  const w=['WHAM!','KRAA!','BOOM!','ZUDA!','PAM!'];
  G.words.push({x,y,t:.5,s:w[Math.random()*w.length|0],col})
}

function dmg(src,dst,amt){
  if(dst.hp<=0)return;
  if(dst.act==='block'||dst.blockT>0)amt*=.25;
  if(src.boost>0)amt*=2.2;
  dst.hp=Math.max(0,dst.hp-amt);
  dst.hurtT=dst.act==='block'?0:.22;
  if(dst.hurtT>0){dst.act='hurt';dst.actT=.22}
  dst.x+=src.f*(dst.act==='block'?2:5);
  dst.x=Math.max(16,Math.min(W-16,dst.x));
  G.shake=Math.max(G.shake,amt>8?5:3);
  src.ult=Math.min(100,src.ult+amt*1.2);
  dst.ult=Math.min(100,dst.ult+amt*.8);
  const mx=(src.x+dst.x)/2;
  spark(mx,GROUND-26,src.isFoe?'#ff2e93':'#ffd23f',10);
  word(mx,GROUND-44,'#fff');
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
}

function startAtk(a,standOn){
  if(a.actT>0||a.hp<=0)return;
  a.act='hit';a.dur=standOn?.55:.28;a.actT=a.dur;a.dealt=0;a.ph=0;a.atkStand=standOn;
}

function updFighter(a,o,dt){
  a.t+=dt;
  if(a.hp<=0){a.act='ko';return}
  if(a.boost>0)a.boost-=dt;
  if(a.frozen>0){a.frozen-=dt;return}
  if(a.actT>0){
    a.actT-=dt;
    if(a.act==='hit'){
      a.ph=1-a.actT/a.dur;
      const hits=a.atkStand?[.25,.5,.75]:[.5];
      const rng=a.atkStand?74:36, base=a.atkStand?(a.isFoe?5:5.5):(a.isFoe?a.d.dmg:6);
      while(a.dealt<hits.length&&a.ph>=hits[a.dealt]){
        if(Math.abs(o.x-a.x)<rng&&Math.abs(o.y-a.y)<26&&(a.f>0?o.x>a.x:o.x<a.x))dmg(a,o,base);
        a.dealt++;
      }
    }
    if(a.actT<=0){a.act='idle';a.atkStand=false}
  }
  // gravité
  a.vy+=520*dt;a.y+=a.vy*dt;
  if(a.y>=GROUND){a.y=GROUND;a.vy=0}
}

function updPlayer(dt){
  const a=me;
  updFighter(a,foe,dt);
  if(a.hp<=0)return;
  const busy=a.actT>0;
  const air=a.y<GROUND;
  let mv=(inp.right?1:0)-(inp.left?1:0);
  if(!busy){
    a.x+=mv*78*dt*(a.stand?1.15:1);a.x=Math.max(16,Math.min(W-16,a.x));
    a.act=mv?'walk':'idle';
    if(mv)a.f=mv;
    else a.f=foe.x>a.x?1:-1;
    if(a.blockT>0)a.act='block';
  }
  if(inp.jump&&!air&&!busy){a.vy=-210}
  if(inp.hit){startAtk(a,a.stand)}
  if(inp.stand){a.stand=!a.stand&&a.gauge>12}
  inp.jump=inp.hit=inp.stand=false;
  if(a.stand){a.gauge-=13*dt;if(a.gauge<=0){a.gauge=0;a.stand=false}}
  else a.gauge=Math.min(100,a.gauge+15*dt);
  if(inp.ult&&a.ult>=100&&!busy){castUlt(a,foe)}
  inp.ult=false;
}

function castUlt(a,o){
  a.ult=0;a.stand=true;G.mode='pose';G.pose=1.3;G.poseName=a.d.ultName;a.act='pose';a.casting=true;
}
function finishUlt(){
  const a=me,o=foe;
  a.act='idle';a.casting=false;
  if(a.d.ult==='freeze'){o.frozen=3.2;a.boost=3.2;a.gauge=100;G.msg='TEMPS ARRÊTÉ';G.msgT=1}
  else{G.proj.push({x:a.x+a.f*14,y:GROUND-30,vx:a.f*260,dmg:34,col:'#ff2e93',r:9,own:a,big:true,life:2})}
}

function updFoe(dt){
  const a=foe,o=me,d=a.d;
  updFighter(a,o,dt);
  if(a.hp<=0||a.frozen>0)return;
  a.stand=a.hp<a.max*.6;
  const dx=o.x-a.x,dist=Math.abs(dx);
  if(a.actT<=0){
    a.f=dx>0?1:-1;
    if(a.blockT>0){a.blockT-=dt;a.act='block'}
    else if(dist>34){
      a.act='walk';a.x+=a.f*(d.spd*48)*dt;
      a.x=Math.max(16,Math.min(W-16,a.x));
    } else a.act='idle';
    a.cd-=dt;
    if(dist<(a.stand?60:34)&&a.cd<=0){startAtk(a,a.stand&&Math.random()<.5);a.cd=(1.6/d.rate)*(.7+Math.random()*.6)}
    if(me.act==='hit'&&dist<60&&Math.random()<dt*1.6)a.blockT=.5;
    a.shoot-=dt;
    if(d.ranged&&dist>70&&a.shoot<=0){
      a.shoot=(2.6/d.rate)*(.7+Math.random()*.6);a.act='hit';a.actT=a.dur=.25;a.dealt=9;
      G.proj.push({x:a.x+a.f*14,y:GROUND-28,vx:a.f*130,dmg:d.dmg,col:d.st.glow,r:5,own:a,life:3});
    }
  }
}

function updProj(dt){
  G.proj=G.proj.filter(p=>{
    p.x+=p.vx*dt;p.life-=dt;
    const tgt=p.own===me?foe:me;
    if(tgt.hp>0&&Math.abs(tgt.x-p.x)<p.r+7&&Math.abs((tgt.y-20)-p.y)<24){
      dmg(p.own,tgt,p.dmg);spark(p.x,p.y,p.col,16);return !!p.big&&false
    }
    return p.life>0&&p.x>-20&&p.x<W+20;
  });
}
/* ===== Partie 4 : rendu, HUD, commandes, boucle ===== */
function bar(x,y,w,h,v,col,rev){
  cx.fillStyle='#120a1f';cx.fillRect(x-1,y-1,w+2,h+2);
  cx.fillStyle='#3b1d6e';cx.fillRect(x,y,w,h);
  const ww=Math.round(w*Math.max(0,v));
  cx.fillStyle=col;cx.fillRect(rev?x+w-ww:x,y,ww,h);
  cx.fillStyle='rgba(255,255,255,.35)';cx.fillRect(rev?x+w-ww:x,y,ww,1);
}
function txt(s,x,y,size,col,align,sh){
  cx.font=size+'px Bangers, Impact, sans-serif';cx.textAlign=align||'left';cx.textBaseline='top';
  if(sh){cx.fillStyle=sh;cx.fillText(s,x+1,y+1)}
  cx.fillStyle=col;cx.fillText(s,x,y);
}
function drawFighter(a,standCol){
  const s={t:a.t,act:a.act,ph:a.ph||0};
  if(a.stand&&a.hp>0){
    const atk=(a.act==='hit'&&a.atkStand)||a.casting;
    standSprite(a.x-a.f*17,a.y,a.f,a.d.st,{t:a.t,atk,ph:a.ph||((a.t*3)%1)});
  }
  human(a.x,a.y,a.f,a.d,s);
  if(a.frozen>0){cx.fillStyle='rgba(53,224,255,.38)';cx.fillRect(Math.round(a.x-12),Math.round(a.y-48),24,50)}
}
function speedLines(t,col){
  cx.save();cx.translate(W/2,H/2);cx.strokeStyle=col;cx.lineWidth=1;
  for(let i=0;i<46;i++){
    const a=i/46*6.283+Math.floor(t*30)%3*.07,r1=40+((i*37+t*400)%60),r2=r1+60+((i*13)%50);
    cx.beginPath();cx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);cx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);cx.stroke();
  }
  cx.restore();
}
function render(){
  cx.save();
  if(G.shake>0){cx.translate(Math.round((Math.random()-.5)*G.shake),Math.round((Math.random()-.5)*G.shake))}
  const bg=foe?foe.d.bg:0;
  drawBG(bg,G.t,me?(me.x-160)*.3:0);
  if(me&&foe){
    // ordre de profondeur selon x
    const L=[me,foe].sort((a,b)=>a.x-b.x);L.forEach(a=>drawFighter(a));
    G.proj.forEach(p=>{
      cx.fillStyle='#fff';cx.fillRect(Math.round(p.x-p.r),Math.round(p.y-p.r/2),p.r*2,p.r);
      cx.fillStyle=p.col;cx.fillRect(Math.round(p.x-p.r),Math.round(p.y-p.r/2)+1,p.r*2,p.r-2);
      if(p.big){cx.fillRect(Math.round(p.x-p.vx*.1-8),Math.round(p.y-3),Math.abs(p.vx*.1),6)}
    });
  }
  G.parts.forEach(p=>{cx.fillStyle=p.col;cx.fillRect(Math.round(p.x),Math.round(p.y),2,2)});
  G.words.forEach(w=>{txt(w.s,w.x,w.y-(0.5-w.t)*20,12,w.col,'center','#120a1f')});
  if(G.mode==='pose'){
    cx.fillStyle='rgba(10,0,25,.72)';cx.fillRect(0,0,W,H);
    speedLines(G.t,me.d.st.glow);
    const k=1.3-G.pose;
    cx.save();cx.translate(W/2,52);cx.transform(1,0,-.12,1,0,0);
    txt(G.poseName,0,0,k<.2?18+k*80:28,'#ffd23f','center','#ff2e93');cx.restore();
    const wob=Math.round(Math.sin(G.t*30)*1);
    txt('ゴゴゴゴ',24+wob,100,24,'#ff2e93','left','#120a1f');
    txt('ゴゴゴゴ',W-24-wob,100,24,'#35e0ff','right','#120a1f');
    human(me.x,me.y,me.f,me.d,{t:me.t,act:'pose',ph:0});
    standSprite(me.x-me.f*17,me.y,me.f,me.d.st,{t:me.t,atk:false,ph:0});
  }
  // HUD
  if(me&&foe){
    bar(8,8,128,7,me.hp/me.max,'#ffd23f',false);
    bar(184,8,128,7,foe.hp/foe.max,'#ff2e93',true);
    bar(8,18,64,3,me.gauge/100,'#35e0ff',false);
    bar(8,24,64,3,me.ult/100,me.ult>=100?'#ffffff':'#ff9a3c',false);
    txt(me.d.name,8,30,10,'#f6ecff','left','#120a1f');
    txt(foe.d.name,312,30,10,'#f6ecff','right','#120a1f');
    txt('VS',W/2,6,12,'#ffd23f','center','#ff2e93');
    if(foe.stand)txt(foe.d.stand,312,40,8,foe.d.st.glow,'right','#120a1f');
    if(me.stand)txt(me.d.stand,8,40,8,me.d.st.glow,'left','#120a1f');
  }
  if(G.msgT>0){
    txt(G.msg,W/2,70,34,'#ffd23f','center','#ff2e93');
    if(G.sub)txt(G.sub,W/2,108,14,'#f6ecff','center','#120a1f');
  }
  cx.restore();
}

function endScreen(win){
  G.mode='over';G.won=win;
  const full=win&&G.round>=FOES.length-1;
  $('endT').textContent=win?(full?'VICTOIRE !':'K.O. !'):'DÉFAITE';
  $('endS').textContent=win?(full?'Les trois porteurs de Stand sont à terre. Tu es le plus fort.':'Manche gagnée. Un nouvel adversaire arrive.'):'Ton adversaire t\'a eu. Relève-toi et recommence la manche.';
  $('again').textContent=win?(full?'MENU':'MANCHE SUIVANTE'):'REVANCHE';
  $('end').hidden=false;
}
$('again').addEventListener('click',()=>{
  $('end').hidden=true;
  if(G.won){
    if(G.round>=FOES.length-1){G.mode='menu';$('menu').hidden=false;return}
    G.round++;startRound();
  } else {me.hp=me.max;me.ult=0;startRound()}
});

function tick(dt){
  G.t+=dt;if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
  G.parts=G.parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt;return p.life>0});
  G.words=G.words.filter(w=>(w.t-=dt)>0);
  if(G.msgT>0)G.msgT-=dt;
  if(G.mode==='menu'&&me&&foe){me.t+=dt;foe.t+=dt}
  if(!me||!foe)return;
  if(G.mode==='intro'){
    me.t+=dt;foe.t+=dt;
    if(G.msgT<=0){G.mode='fight';G.msg='COMBAT !';G.msgT=.6;G.sub=''}
  } else if(G.mode==='fight'){
    updPlayer(dt);updFoe(dt);updProj(dt);
    if(me.hp<=0||foe.hp<=0){G.mode='ko';G.ko=1.6;G.msg='K.O.';G.msgT=1.6;G.sub=''}
  } else if(G.mode==='pose'){
    me.t+=dt;G.pose-=dt;
    if(G.pose<=0){G.mode='fight';finishUlt()}
  } else if(G.mode==='ko'){
    updFighter(me,foe,dt);updFighter(foe,me,dt);updProj(dt);
    G.ko-=dt;if(G.ko<=0)endScreen(foe.hp<=0);
  }
  // boutons
  const u=$('ultk');
  u.classList.toggle('ready',me.ult>=100&&G.mode==='fight');
  u.classList.toggle('dim',me.ult<100);
}

/* ----- commandes tactiles + clavier ----- */
document.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k,held=(k==='left'||k==='right');
  const on=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
    el.classList.add('down');inp[k]=true};
  const off=e=>{el.classList.remove('down');if(held)inp[k]=false};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyJ:'hit',KeyK:'stand',KeyL:'ult'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){e.preventDefault();inp[k]=true}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k&&(k==='left'||k==='right'))inp[k]=false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('.pick'))e.preventDefault()},{passive:false});

/* ----- menu ----- */
const pk=$('pick');
Object.entries(FIGHTERS).forEach(([key,f])=>{
  const b=document.createElement('button');
  b.innerHTML=f.name+'<small>Stand : '+f.stand+'<br>Ultime : '+f.ultName+'</small>';
  if(key===G.picked)b.className='on';
  b.addEventListener('click',()=>{G.picked=key;[...pk.children].forEach(c=>c.classList.remove('on'));b.className='on'});
  pk.appendChild(b);
});
$('go').addEventListener('click',()=>{$('menu').hidden=true;newGame()});

/* ----- boucle ----- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  tick(dt);render();requestAnimationFrame(loop);
}
// aperçu du menu : décor + deux combattants en pose
(function(){me=mk('salomon');foe=mk(null,FOES[0]);me.x=100;foe.x=220;foe.f=-1;me.stand=true;foe.stand=true})();
requestAnimationFrame(loop);
</script>
