<title>Jojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* Layout: arène 16:9 en haut, manette tactile dessous (portrait) ou par-dessus (paysage). Look: manga acide, aplats violet/magenta/jaune, contours épais. */
:root{
  --ink:#120a1f;
  --violet:#3b1d6e;
  --magenta:#ff2e93;
  --gold:#ffd23f;
  --cyan:#35e0ff;
  --paper:#f6ecff;
  --display:'Bangers','Impact','Arial Black',sans-serif;
  --body:'Rubik','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--paper);font-family:var(--body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px;
}
#stage{position:relative;width:100%;max-width:min(100%,calc((100vh - 250px)*1.7778));margin:6px auto 0;aspect-ratio:16/9;border:3px solid var(--gold);border-radius:6px;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--magenta)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:12px;background:rgba(18,10,31,.88)}
.overlay[hidden]{display:none!important}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,64px);letter-spacing:2px;margin:0;line-height:.95;color:var(--gold);text-shadow:3px 3px 0 var(--magenta),6px 6px 0 var(--violet);transform:skew(-6deg)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,34px);margin:0;color:var(--cyan);letter-spacing:1px}
p.sub{margin:0;font-size:clamp(11px,3vw,14px);opacity:.85;max-width:34ch;line-height:1.35}
.btn{font-family:var(--display);font-size:clamp(18px,5vw,26px);letter-spacing:1px;color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:8px;padding:8px 22px;box-shadow:4px 4px 0 var(--magenta);cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--magenta)}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(100%,420px)}
.pick button{font-family:var(--body);font-weight:700;font-size:12px;color:var(--paper);background:var(--violet);border:2px solid var(--paper);border-radius:6px;padding:8px 6px;line-height:1.25}
.pick button small{display:block;font-weight:400;opacity:.8;font-size:10px}
.pick button.on{background:var(--magenta);border-color:var(--gold)}
#pad{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.grp{display:grid;gap:8px}
#dirs{grid-template-columns:repeat(2,76px)}
#acts{grid-template-columns:repeat(3,68px);align-items:center}
.k{height:66px;border-radius:50%;border:3px solid var(--paper);background:var(--violet);color:var(--paper);font-family:var(--display);font-size:15px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}
#dirs .k{border-radius:14px;height:76px;font-size:30px}
.k.down{background:var(--magenta);transform:scale(.94)}
.k.gold{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.k.gold.down{background:var(--cyan)}
.k.dim{opacity:.35}
.k.ready{animation:pulse .6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 var(--cyan)}to{box-shadow:0 0 0 8px transparent}}
@media (orientation:landscape) and (max-height:520px){
  body{padding:0;display:block}
  #stage{max-width:none;width:auto;height:100%;margin:0 auto;border-radius:0;box-shadow:none;border-width:0}
  #pad{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:6px;padding:0;pointer-events:none}
  #pad .k{pointer-events:auto;opacity:.82}
  #dirs{grid-template-columns:repeat(2,64px)}#dirs .k{height:64px}
  #acts{grid-template-columns:repeat(3,58px)}.k{height:58px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){.k.ready{animation:none}}
#menu{background:rgba(18,10,31,.5);justify-content:flex-end;padding-bottom:10px}
#snd{position:absolute;bottom:6px;right:6px;z-index:5;width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);background:rgba(18,10,31,.7);color:var(--paper);font-size:13px;line-height:1;padding:0}
#snd.off{opacity:.45}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;700&display=swap">
<div id="stage">
  <button id="snd" aria-label="Son">♪</button>
  <canvas id="c" width="384" height="216"></canvas>
  <div class="overlay" id="menu">
    <h1>JOJO</h1>
    <p class="sub">Garde, esquive, enchaîne les coups, invoque ton Stand et finis avec ta pose ultime.</p>
    <div class="pick" id="pick"></div>
    <button class="btn" id="go">COMBATTRE</button>

  <div class="overlay" id="end" hidden>
    <h1 id="endT">K.O.</h1>
    <p class="sub" id="endS"></p>
    <button class="btn" id="again">CONTINUER</button>
  </div>
</div>
<div id="pad">
  <div class="grp" id="dirs">
    <div class="k" data-k="left">◀</div>
    <div class="k" data-k="right">▶</div>
  </div>

    <div class="k" data-k="dash">ESQUIVE</div>
    <div class="k gold" data-k="ult" id="ultk">ULTIME</div>
  </div>
</div>
<script>
/* ===== 2 : noyau, couleurs, primitives de dessin pixel ===== */
const W=384,H=216,GROUND=178;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* couleurs : mélange avec memo */
const _m={};
function mix(c,o,k){
  const key=c+o+k;if(_m[key])return _m[key];
  const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const a=p(c),b=p(o);
  return _m[key]='#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('');
}
const dk=(c,k=.38)=>mix(c,'#0a0614',k);
const lt=(c,k=.28)=>mix(c,'#ffffff',k);

function rect(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h)}
function line(x0,y0,x1,y1,th,c){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=x1-x0,dy=y1-y0,n=Math.max(Math.abs(dx),Math.abs(dy),1),o=th>>1;
  cx.fillStyle=c;
  for(let i=0;i<=n;i++)cx.fillRect(Math.round(x0+dx*i/n)-o,Math.round(y0+dy*i/n)-o,th,th);
}
/* membre : contour, remplissage, ombre côté arrière, reflet côté avant */
function limb(x0,y0,x1,y1,th,c,f){
  line(x0,y0,x1,y1,th+2,'#0d0718');
  line(x0,y0,x1,y1,th,c);
  const o=Math.max(1,th>>1);
  line(x0-f*o+f,y0,x1-f*o+f,y1,1,dk(c));
  if(th>=4)line(x0+f*(o-1),y0,x1+f*(o-1),y1,1,lt(c,.18));
}
function disc(x,y,r,c){
  cx.fillStyle=c;
  for(let j=-r;j<=r;j++){const w=Math.floor(Math.sqrt(r*r-j*j));cx.fillRect(Math.round(x-w),Math.round(y+j),w*2+1,1)}
}
function ring(x,y,r,c,th=2){
  cx.fillStyle=c;
  const n=Math.max(12,r*3);
  for(let i=0;i<n;i++){const a=i/n*6.2832;cx.fillRect(Math.round(x+Math.cos(a)*r),Math.round(y+Math.sin(a)*r*.55),th,th)}
}
function shadow(x,gy,w,a=.5){
  cx.fillStyle='rgba(6,2,14,'+a+')';
  for(let i=0;i<5;i++){const ww=Math.max(2,w-i*5);cx.fillRect(Math.round(x-ww/2),gy+i-2,ww,1)}
}

/* ===== combattants (originaux) ===== */
const FIGHTERS={
  salomon:{name:'SALOMON',stand:'TIC-TAC',skin:'#f0bf98',hair:'#1b1a3a',top:'#23203a',pants:'#2b2a52',boot:'#100d1c',acc:'#ffd23f',
    bulk:1,hairStyle:0,coat:'#1a1830',scarf:null,
    st:{body:'#3c58d6',acc:'#ffd23f',glow:'#35e0ff',skin:'#9db8ff',crest:'clock'},ult:'freeze',ultName:'LE TEMPS S\'ARRÊTE'},
  mirella:{name:'MIRELLA',stand:'ROSE NOIRE',skin:'#e8b48c',hair:'#c0295e',top:'#2f8a66',pants:'#3a2d5c',boot:'#14101f',acc:'#ffd23f',
    bulk:.92,hairStyle:1,coat:null,scarf:'#ff5c9a',
    st:{body:'#e0407f',acc:'#ffe7f1',glow:'#ff2e93',skin:'#ffb3d1',crest:'thorn'},ult:'beam',ultName:'RAYON ÉCARLATE'}
};
const FOES=[
  {name:'BRUTUS KANE',stand:'GRANITE',hp:100,spd:.62,dmg:7,rate:1.0,bg:0,trait:'lunge',bulk:1.22,hairStyle:3,coat:null,scarf:null,
   skin:'#d49b78',hair:'#3a2a1a',top:'#8a2f2f',pants:'#4d4d57',boot:'#1b1417',acc:'#ffd23f',
   st:{body:'#8a8f9c',acc:'#d0d0e0',glow:'#ffffff',skin:'#b4b8c4',crest:'horn'}},
  {name:'NOX VESPER',stand:'ÉCLIPSE',hp:120,spd:.85,dmg:6,rate:.85,bg:1,trait:'blink',bulk:.95,hairStyle:2,coat:'#1b1236',scarf:null,
   skin:'#cdd6f0',hair:'#e8e8ff',top:'#2a1d4d',pants:'#1c1535',boot:'#0b0818',acc:'#35e0ff',
   st:{body:'#6a2fc0',acc:'#35e0ff',glow:'#b56cff',skin:'#c9a6ff',crest:'thorn'}},
  {name:'DOCTEUR ORAGE',stand:'FOUDRE MÈRE',hp:150,spd:.95,dmg:8,rate:.7,bg:2,trait:'bolt',bulk:1.02,hairStyle:3,coat:'#e8e8ee',scarf:null,
   skin:'#eac9a8',hair:'#ffd23f',top:'#dedede',pants:'#2b2b3d',boot:'#0d0d16',acc:'#ff2e93',
   st:{body:'#ffd23f',acc:'#35e0ff',glow:'#fff6a0',skin:'#fff0a8',crest:'clock'}}
];
/* ===== 3 : squelette, poses, dessin du combattant et du Stand ===== */
function fr(x,y,f,ox,oy,w,h,c){rect(x+f*ox-(f<0?w:0),y+oy,w,h,c)}

function mkP(lean,tilt,aB,aF,lB,lF,sink){return{lean,tilt,aB,aF,lB,lF,sink:sink||0}}

/* extension d'une attaque : -1..0 armement, 0..1 frappe, retombe ensuite */
function atkExt(a){
  const k=a.atk;if(!k)return 0;
  const p=a.stT,w=k.w,ac=k.a,tot=k.w+k.a+k.r;
  if(p<w)return -ease(p/w);
  if(p<w+ac)return ease((p-w)/ac);
  return 1-ease((p-w-ac)/(tot-w-ac));
}
function walkLegs(ph){
  const s1=Math.sin(ph),s2=Math.sin(ph+3.1416);
  return [[s2*.7-.05,s2*.7-.05-.55*(.5+.5*Math.cos(ph+3.1416))],[s1*.7+.15,s1*.7+.15-.55*(.5+.5*Math.cos(ph))]];
}
function getPose(a){
  const t=a.t,p=a.stT;
  const br=Math.sin(t*3.2)*.03;
  switch(a.st){
  case 'walk':{
    const dirn=(a.vx*a.f>=0)?1:-1,ph=t*11*dirn,L=walkLegs(ph);
    return mkP(.1+br,0,[.7,2.2],[.95,2.35],L[0],L[1]);
  }
  case 'jump':
    return a.vy<0?mkP(.1,0,[.5,1.9],[.8,2.2],[.2,-.9],[.9,-.3]):mkP(.05,0,[.4,1.7],[.7,2.0],[-.1,-.1],[.5,.15]);
  case 'atk':{
    const e=atkExt(a),k=a.atk,ep=Math.max(e,0),en=Math.max(-e,0);
    if(k.id===2){ // coup de pied
      return mkP(.05-.22*ep,-.1*ep,[.5,2.0],[.9,2.3],[-.5-.1*ep,-.3],[lerp(.45,1.45,ep)-en*.5,lerp(.15,1.5,ep)-en*.9]);
    }
    if(k.id===9){ // pose de commande du Stand
      return mkP(.18,0,[.6,2.3],[1.5,1.55],[-.5,-.3],[.7,.2]);
    }
    const front=k.id===0;
    const sA=ep>0?lerp(.9,1.57,ep):lerp(.9,.25,en),eA=ep>0?lerp(2.3,1.57,ep):lerp(2.3,3.0,en);
    const guard=[.8,2.3];
    return mkP(.08+(front?.32:.5)*ep-.12*en,0,front?[.7,2.2]:[sA,eA],front?[sA,eA]:[.95,2.35],[-.45-.35*ep,-.25],[.5+.5*ep,.15]);
  }
  case 'hurt':{
    const k=ease(p/.08);
    return mkP(lerp(.1,-.32,k),lerp(0,-.35,k),[-.4,-.1],[.1,.6],[.2,.55],[.55,.3],0);
  }
  case 'block':
    return mkP(.18,0,[1.0,2.7],[1.2,2.95],[-.7,-.25],[.9,.12]);
  case 'dash':
    return mkP(.62,.1,[-.8,-.9],[-.5,-.7],[-.9,-.5],[1.15,.35]);
  case 'down':case 'ko':{
    const k=a.st==='ko'?1:ease(p/.28);
    return mkP(lerp(.1,-1.5,k),lerp(0,-.3,k),[-1.2,-1.0],[-1.0,-.8],[1.4,1.45],[1.35,1.4],lerp(0,-1,k));
  }
  case 'getup':{
    const k=ease(p/a.stDur);
    return mkP(lerp(-1.5,.1,k),0,[lerp(-1.2,.7,k),lerp(-1,2.2,k)],[lerp(-1,.95,k),lerp(-.8,2.35,k)],[lerp(1.4,-.45,k),lerp(1.45,-.25,k)],[lerp(1.35,.5,k),lerp(1.4,.15,k)]);
  }
  case 'pose':{
    const k=ease(p/.35);
    return mkP(lerp(.1,-.28,k),lerp(0,-.15,k),[.5,1.6],[lerp(.9,2.7,k),lerp(2.3,2.85,k)],[-.7,-.3],[.9,.2]);
  }
  default: // idle : garde, respiration
    return mkP(.1+br,0,[.7+Math.sin(t*3)*.04,2.2],[.95,2.35+Math.sin(t*3.4)*.05],[-.45,-.25],[.5+br*2,.15],Math.sin(t*3.2)>0?0:0);
  }
}

function rigJ(X,Y,f,P,S){
  const T=12*S,SH=12*S,TO=16*S,UA=9*S,FA=9*S;
  const leg=a=>{const kx=Math.sin(a[0])*T*f,ky=Math.cos(a[0])*T;return[kx,ky,kx+Math.sin(a[1])*SH*f,ky+Math.cos(a[1])*SH]};
  const lB=leg(P.lB),lF=leg(P.lF),low=Math.max(lB[3],lF[3]);
  const hx=X,hy=Y-low-P.sink*3;
  const sx=hx+Math.sin(P.lean)*TO*f,sy=hy-Math.cos(P.lean)*TO;
  const arm=a=>{const ex=sx+Math.sin(a[0])*UA*f,ey=sy+Math.cos(a[0])*UA;return[ex,ey,ex+Math.sin(a[1])*FA*f,ey+Math.cos(a[1])*FA]};
  return{hx,hy,sx,sy,lB:lB.map((v,i)=>v+(i%2?hy:hx)),lF:lF.map((v,i)=>v+(i%2?hy:hx)),aB:arm(P.aB),aF:arm(P.aF),
    hd:[sx+Math.sin(P.lean+P.tilt)*8*S*f,sy-Math.cos(P.lean+P.tilt)*8*S]};
}

function hairDraw(hx,hy,f,col,style,t,sway){
  const o='#0d0718',h2=lt(col,.22);
  if(style===1){ // queue de cheval
    line(hx-f*4,hy-3,hx-f*(9+sway),hy+4,4,o);line(hx-f*4,hy-3,hx-f*(9+sway),hy+4,2,col);
    line(hx-f*9,hy+4,hx-f*(12+sway*2),hy+12,4,o);line(hx-f*9,hy+4,hx-f*(12+sway*2),hy+12,2,col);
  }
  if(style===2){ // mi-long plaqué en arrière
    line(hx-f*5,hy-5,hx-f*(9+sway),hy+7,5,o);line(hx-f*5,hy-5,hx-f*(9+sway),hy+7,3,col);
  }
  rect(hx-6,hy-8,12,6,o);rect(hx-5,hy-7,10,4,col);rect(hx-3,hy-7,5,1,h2);
  const sp=style===3?[[-5,-8,-8,-15],[-1,-8,-2,-17],[3,-8,6,-16],[5,-5,10,-10],[-6,-4,-10,-8]]:
           style===0?[[-3,-8,-5,-14],[0,-8,1,-16],[3,-8,6,-14]]:[];
  sp.forEach(s=>{line(hx+f*s[0],hy+s[1],hx+f*s[2],hy+s[3],4,o);line(hx+f*s[0],hy+s[1],hx+f*s[2],hy+s[3],2,col)});
}

/* dessin d'un humanoïde ; alpha pour images rémanentes */
function human(a,alpha,ns){
  const d=a.d,f=a.f,S=d.bulk,P=getPose(a),J=rigJ(a.x,a.y,f,P,S);
  const lying=a.st==='ko'||a.st==='down'||a.st==='getup';
  cx.globalAlpha=alpha==null?1:alpha;
  if(!ns)shadow(a.x,GROUND,lying?44:28,.5*(alpha==null?1:alpha));
  const th=Math.round(5*S),sway=Math.sin(a.t*6)*2+(a.vx||0)*-.02*f;
  const pantsB=dk(d.pants,.3),topB=dk(d.top,.3),skinB=dk(d.skin,.25);
  // manteau (derrière)
  if(d.coat){
    const cs=clamp(-(a.vx||0)*f*.05,-5,7)+Math.sin(a.t*3)*1.2;
    limb(J.hx-f*2,J.hy-1,J.hx-f*(6+cs),J.hy+17-(lying?12:0),9,d.coat,f);
  }
  if(d.scarf){
    for(let i=0;i<5;i++){const sx=J.sx-f*(3+i*3),sy=J.sy+1+Math.sin(a.t*8+i)*1.5+i*.6;rect(sx-1,sy-1,4,4,'#0d0718');}
    for(let i=0;i<5;i++){const sx=J.sx-f*(3+i*3),sy=J.sy+1+Math.sin(a.t*8+i)*1.5+i*.6;rect(sx,sy,2,2,i%2?d.scarf:lt(d.scarf,.2));}
  }
  // bras arrière
  limb(J.sx,J.sy,J.aB[0],J.aB[1],th,topB,f);limb(J.aB[0],J.aB[1],J.aB[2],J.aB[3],th-1,skinB,f);
  rect(J.aB[2]-2,J.aB[3]-2,4,4,'#0d0718');rect(J.aB[2]-1,J.aB[3]-1,2,2,skinB);
  // jambe arrière
  limb(J.hx,J.hy,J.lB[0],J.lB[1],th+1,pantsB,f);limb(J.lB[0],J.lB[1],J.lB[2],J.lB[3],th,pantsB,f);
  limb(J.lB[2]-f,J.lB[3]-1,J.lB[2]+f*5,J.lB[3],4,dk(d.boot,.1),f);
  // torse
  limb(J.hx,J.hy,J.sx,J.sy,Math.round(11*S),d.top,f);
  fr(J.hx,J.hy,f,-5,-3,11,2,d.acc);                                     // ceinture
  limb(J.sx-f*1,J.sy+2,J.hx-f*1,J.hy-2,3,d.coat||lt(d.top,.12),f);     // pan central
  rect(J.sx-1,J.sy+3,2,2,d.acc);
  // tête
  const hx=J.hd[0],hy=J.hd[1],hurt=a.st==='hurt'||lying;
  rect(hx-6,hy-6,12,12,'#0d0718');rect(hx-5,hy-5,10,10,d.skin);rect(hx-5,hy+2,10,3,dk(d.skin,.15));
  hairDraw(hx,hy,f,d.hair,d.hairStyle,a.t,sway);
  if(hurt){fr(hx,hy,f,1,-2,4,1,'#0d0718');fr(hx,hy,f,2,3,3,2,'#6a1a2a')}
  else{
    fr(hx,hy,f,1,-2,4,3,'#ffffff');fr(hx,hy,f,3,-2,2,3,'#0d0718');

    if(a.frozen<=0&&a.fzHits>0&&a.hp>0){
      a.fzHits=0;a.vx=(a.x>=o.x?1:-1)*150;a.vy=-210;setSt(a,'down',.9);
      G.hitstop=.1;G.shake=6;sfx.heavy();G.msg='LE TEMPS REPART';G.msgT=1;G.sub='';
    }
    return;
  }
  const free=a.st==='idle'||a.st==='walk'||a.st==='block'||a.st==='jump';
  a.guarding=false;a.cd-=dt;a.ac-=dt;a.aiT-=dt;a.shoot-=dt;
  a.standOn=a.hp<a.max*.65&&a.hp>0;
  if(!free||o.hp<=0)return;
  const dx=o.x-a.x,ad=Math.abs(dx),tr=a.d.trait;
  a.f=dx>0?1:-1;
  if(o.st==='atk'&&ad<58&&a.aiAct!=='guard'&&Math.random()<dt*(.9+a.d.rate*.9)){a.aiAct='guard';a.aiT=rnd(.3,.55)}
  if(a.aiAct==='guard'){
    if(a.aiT>0){a.guarding=true;a.st='block';a.vx*=.6;return}
    a.aiAct='';a.aiT=.08;
  }
  if(a.aiT>0){
    if(a.aiAct==='in'){a.vx=a.f*a.d.spd*64;a.st='walk'}
    else if(a.aiAct==='out'){a.vx=-a.f*a.d.spd*46;a.st='walk'}
    else{a.vx*=.8;a.st='idle'}
    return;
  }
  a.vx=0;a.st='idle';
  if(a.aiAct==='lunge'){a.aiAct='';startAtk(a,2);return}
  if(a.aiAct==='post'){a.aiAct='';startAtk(a,1);return}
  a.aiAct='';
  if(a.cd<=0){
    if(tr==='lunge'&&ad>58&&ad<160){
      a.cd=rnd(2.2,3.4)/a.d.rate;setSt(a,'dash',.26);a.vx=a.f*280;ghost(a);sfx.dash();a.aiAct='lunge';return;
    }
    if(tr==='blink'&&ad<130){
      a.cd=rnd(3,4.6);ghost(a);spark(a.x,a.y-24,'#b56cff',14);
      a.x=clamp(o.x-o.f*36,24,W-24);if(Math.abs(a.x-o.x)<18)a.x=clamp(o.x+o.f*36,24,W-24);
      a.f=o.x>a.x?1:-1;spark(a.x,a.y-24,'#b56cff',14);sfx.stand();a.aiAct='post';a.aiT=.17;return;
    }
    if(tr==='bolt'&&ad>30){
      a.cd=rnd(2.6,3.8)/a.d.rate;G.bolts.push({x:o.x,t:0,warn:.75,own:a,hit:false,fl:0});sfx.charge();
      a.aiAct='cast';a.aiT=.5;return;
    }
  }
  if(a.d.trait==='blink'&&a.shoot<=0&&ad>90){
    a.shoot=rnd(2,3.2);sfx.stand();
    G.proj.push({x:a.x+a.f*14,y:GROUND-28,vx:a.f*140,r:5,dmg:a.d.dmg,col:a.d.st.glow,own:a,life:3});
    a.aiAct='cast';a.aiT=.35;return;
  }
  if(ad<=46){
    if(a.ac<=0){
      a.ac=rnd(.3,.7)/a.d.rate;
      if(a.standOn&&Math.random()<.5)startRush(a);else startAtk(a,0);
    }else{a.aiAct=Math.random()<.35?'out':'idle';a.aiT=rnd(.1,.28)}
  }else{
    a.aiAct=(ad<62&&Math.random()<.2)?'out':'in';a.aiT=rnd(.25,.55);
  }
}

/* ---------- projectiles, foudre, rayon ---------- */
function updProj(dt){
  G.proj=G.proj.filter(p=>{
    if(p.own.isFoe&&G.timeStop>0)return true;
    p.x+=p.vx*dt;p.life-=dt;
    const t=p.own===me?foe:me;
    if(t.hp>0&&Math.abs(t.x-p.x)<p.r+8&&Math.abs((t.y-24)-p.y)<26){
      strike(p.own,t,p.dmg,45,false,false);spark(p.x,p.y,p.col,14);return false;
    }
    return p.life>0&&p.x>-30&&p.x<W+30;
  });
}
function updBolts(dt){
  G.bolts=G.bolts.filter(b=>{
    if(G.timeStop>0)return true;
    b.t+=dt;
    if(b.t>=b.warn&&!b.hit){
      b.hit=true;b.fl=.3;sfx.bolt();G.flash=.2;G.shake=Math.max(G.shake,4);spark(b.x,GROUND-2,'#fff6a0',20);
      if(Math.abs(me.x-b.x)<18&&me.y>=GROUND-26)strike(b.own,me,12,90,true,true);
    }
    if(b.fl>0)b.fl-=dt;
    return b.t<b.warn+.4;
  });
}
function updBeam(dt){
  const b=G.beam;if(!b)return;
  b.t+=dt;
  if(b.t>=.1&&!b.hit){
    b.hit=true;
    const a=b.own,o=a===me?foe:me;
    if((o.x-a.x)*b.dir>0&&o.y>GROUND-30)strike(a,o,36,170,true,true);
    else G.words.push({x:o.x,y:GROUND-60,t:.7,max:.7,s:'ESQUIVÉ !',col:'#35e0ff'});
  }
  if(b.t>b.dur)G.beam=null;
}
function sep(a,b){
  if(Math.abs(a.y-b.y)>24||a.st==='ko'||b.st==='ko'||a.st==='down'||b.st==='down')return;
  const dx=b.x-a.x,m=17;
  if(Math.abs(dx)<m){const s=dx>=0?1:-1,push=(m-Math.abs(dx))/2;a.x-=s*push;b.x+=s*push;
    a.x=clamp(a.x,18,W-18);b.x=clamp(b.x,18,W-18)}
}

function mkLayer(w,h,fn){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(g);return c;
}
function Rg(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}

function bandSky(g,cols,y0,y1,w){
  const n=cols.length,bh=(y1-y0)/n;
  for(let i=0;i<n;i++){
    const ya=Math.round(y0+i*bh),yb=Math.round(y0+(i+1)*bh);
    Rg(g,0,ya,w,yb-ya+1,cols[i]);
    if(i<n-1)for(let k=0;k<4;k++)for(let x=(k%2);x<w;x+=2)Rg(g,x,yb-1-k+ (k>1?0:0),1,1,cols[i+1]);
  }
}
function windows(g,x,y,w,h,r,cols,dens){
  for(let wy=y+4;wy<y+h-4;wy+=6)for(let wx=x+3;wx<x+w-4;wx+=5){
    if(r()<dens)Rg(g,wx,wy,2,3,cols[r()*cols.length|0]);
  }
}
function buildings(g,r,y,xs,minH,maxH,minW,maxW,col,edge,wins,dens,roofs){
  let x=xs;
  while(x<g.canvas.width+10){
    const w=minW+(r()*(maxW-minW)|0),h=minH+(r()*(maxH-minH)|0);
    Rg(g,x,y-h,w,h+40,col);
    Rg(g,x,y-h,w,1,edge);Rg(g,x+w-1,y-h,1,h+40,dk(col,.3));
    if(roofs&&r()<.5){Rg(g,x+3,y-h-6,2,6,col);Rg(g,x+2,y-h-8,4,2,col)}
    if(roofs&&r()<.3){Rg(g,x+w-9,y-h-5,7,5,col);Rg(g,x+w-9,y-h-5,7,1,edge)}
    windows(g,x,y-h,w,h,r,wins,dens);
    x+=w+(r()*3|0);
  }
}

  const gr=g.createRadialGradient(W/2,H/2,H*.42,W/2,H/2,W*.62);
  gr.addColorStop(0,'rgba(8,2,20,0)');gr.addColorStop(1,'rgba(8,2,20,.55)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
});
function bar(x,y,w,h,v,col,trail,rev){
  rect(x-2,y-2,w+4,h+4,'#0d0718');rect(x-1,y-1,w+2,h+2,'#f6ecff');rect(x,y,w,h,'#2a1650');
  const wv=Math.round(w*clamp(v,0,1)),wt=Math.round(w*clamp(trail==null?v:trail,0,1));
  if(wt>wv)rect(rev?x+w-wt:x,y,wt,h,'#ff7b54');
  rect(rev?x+w-wv:x,y,wv,h,col);
  rect(rev?x+w-wv:x,y,wv,1,lt(col,.45));rect(rev?x+w-wv:x,y+h-2,wv,2,dk(col,.3));
}
function portrait(x,y,d){
  rect(x-1,y-1,26,26,'#0d0718');rect(x,y,24,24,'#ffd23f');rect(x+1,y+1,22,22,'#2a1650');
  rect(x+3,y+19,18,4,d.top);rect(x+6,y+8,12,12,d.skin);rect(x+5,y+4,14,6,d.hair);
  rect(x+11,y+12,2,2,'#0d0718');rect(x+15,y+12,2,2,'#0d0718');rect(x+10,y+17,5,1,dk(d.skin,.4));
}
function drawBurst(b){
  const k=b.t/b.max,n=b.heavy?12:8,len=(b.heavy?26:17)*(1-k*.4);
  for(let i=0;i<n;i++){
    const a=i/n*6.283+(b.heavy?.2:0),l=len*(i%2?.55:1);
    line(b.x+Math.cos(a)*4,b.y+Math.sin(a)*4,b.x+Math.cos(a)*(4+l*(1-k)),b.y+Math.sin(a)*(4+l*(1-k)),k>.5?2:3,k>.5?'#ffd23f':'#ffffff');
  }
}
function drawFighter(a){
  if(a.sOff<=6){stand(a);human(a)}else{human(a);stand(a)}
  if(a.frozen>0){cx.fillStyle='rgba(120,200,255,.34)';cx.fillRect(Math.round(a.x-13),Math.round(a.y-52),26,54)}
  if(a.boost>0&&!a.isFoe&&G.timeStop>0){ // aura de l'utilisateur
    cx.globalAlpha=.25+.1*Math.sin(G.t*20);disc(a.x,a.y-26,26,'#35e0ff');cx.globalAlpha=1;
  }
}
function drawBeam(){
  const b=G.beam;if(!b)return;
  const a=b.own,x0=a.x+b.dir*12,y=GROUND-30,x1=b.dir>0?W+10:-10,ww=Math.abs(x1-x0),xl=Math.min(x0,x1);
  if(b.t<.1){ // charge
    const r=3+b.t*70;cx.globalAlpha=.8;disc(x0,y,r,'#ff2e93');disc(x0,y,r*.5,'#fff');cx.globalAlpha=1;return;
  }
  const k=1-(b.t-.1)/(b.dur-.1),h=Math.round(5+22*Math.sin(Math.min(1,k*1.3)*3.14159));
  cx.globalAlpha=.4;rect(xl,y-h-4,ww,(h+4)*2,'#ff2e93');cx.globalAlpha=.9;rect(xl,y-h,ww,h*2,'#ff2e93');
  rect(xl,y-(h>>1),ww,h,'#ffd0e6');rect(xl,y-(h>>2),ww,h>>1,'#ffffff');cx.globalAlpha=1;
  for(let i=0;i<8;i++)rect(x0+b.dir*rnd(0,ww),y+rnd(-h,h),2,2,'#fff');
  disc(x0,y,h+3,'#ffffff');
}
function drawBolts(){
  G.bolts.forEach(b=>{
    if(b.t<b.warn){
      const k=b.t/b.warn;
      cx.globalAlpha=.3+.5*k;ring(b.x,GROUND-1,22-k*10,'#fff6a0',2);ring(b.x,GROUND-1,8+k*6,'#ff2e93',2);cx.globalAlpha=1;
      if(Math.floor(b.t*14)%2===0)rect(b.x-1,GROUND-14,3,8,'#fff6a0');
    }else if(b.fl>0){
      let x=b.x,y=0;
      cx.globalAlpha=Math.min(1,b.fl/.15);
      while(y<GROUND){const ny=y+rnd(10,18),nx=b.x+rnd(-9,9)*(ny<GROUND?1:0);line(x,y,nx,ny,5,'#b56cff');line(x,y,nx,ny,2,'#ffffff');x=nx;y=ny}
      disc(b.x,GROUND,12,'#fff6a0');cx.globalAlpha=1;
    }
  });
}
function drawHUD(){
  if(!me||!foe)return;
  portrait(5,5,me.d);portrait(W-29,5,foe.d);
  bar(34,8,138,10,me.hp/me.max,'#ffd23f',me.trail/me.max,false);
  bar(W-34-138,8,138,10,foe.hp/foe.max,'#ff2e93',foe.trail/foe.max,true);
  txt(me.d.name,34,20,10,'#f6ecff','left','#0d0718');
  txt(foe.d.name,W-34,20,10,'#f6ecff','right','#0d0718');
  // manches
  for(let i=0;i<FOES.length;i++){
    const x=W/2-12+i*12,on=i<G.round;
    rect(x-1,9,9,9,'#0d0718');rect(x,10,7,7,on?'#ffd23f':'#2a1650');
  }
  txt('VS',W/2,0,10,'#ffd23f','center','#ff2e93');
  // jauges du joueur
  bar(34,33,74,4,me.gauge/100,'#35e0ff',null,false);
  const full=me.ult>=100;
  bar(34,41,74,4,me.ult/100,full&&Math.floor(G.t*6)%2?'#ffffff':'#ff9a3c',null,false);
  txt(me.d.stand,112,30,8,me.standOn?me.d.st.glow:'#8a78b0','left','#0d0718');
  if(full&&G.mode==='fight')txt('ULTIME PRÊT',112,38,8,'#ffd23f','left','#0d0718');
  if(foe.standOn)txt(foe.d.stand,W-34,32,8,foe.d.st.glow,'right','#0d0718');
  if(me.comboN>=2&&me.comboT>0)txt(me.comboN+' COUPS !',10,58,16,'#ffd23f','left','#ff2e93');
}
function drawPose(){
  const a=G.castBy,k=1.5-G.pose,d=a.d.st;
  cx.fillStyle='rgba(6,0,18,.78)';cx.fillRect(0,0,W,H);
  // rayons
  cx.save();cx.translate(W/2,96);
  for(let i=0;i<30;i++){
    const an=i/30*6.283+G.t*.35;cx.fillStyle=i%2?d.glow:dk(d.body,.5);cx.globalAlpha=.18;
    cx.beginPath();cx.moveTo(0,0);cx.lineTo(Math.cos(an)*420,Math.sin(an)*420);cx.lineTo(Math.cos(an+.1)*420,Math.sin(an+.1)*420);cx.closePath();cx.fill();
  }
  cx.restore();cx.globalAlpha=1;
  // bande diagonale avec le personnage en gros plan
  cx.save();
  const sl=Math.min(1,k*5);
  cx.beginPath();cx.moveTo(0,58);cx.lineTo(W,40);cx.lineTo(W,40+122*sl);cx.lineTo(0,58+122*sl);cx.closePath();cx.clip();
  cx.fillStyle=dk(d.body,.55);cx.fillRect(0,0,W,H);
  cx.fillStyle=d.glow;cx.globalAlpha=.35;
  for(let i=0;i<46;i++){const yy=((i*37+G.t*600)%H),xx=((i*91+G.t*900)%(W+60))-30;cx.fillRect(Math.round(W-xx),Math.round(yy),30+(i%4)*14,1+(i%3==0?1:0))}
  cx.globalAlpha=1;
  const c=Object.assign({},a,{x:0,y:0,standT:1,sOff:-24,sMode:'pose',f:1,vx:0});
  cx.save();cx.translate(Math.round(W/2),172);cx.scale(2,2);
  stand(c);human(c,1,true);
  cx.restore();
  cx.restore();
  rect(0,58,W,2,'#ffd23f');
  // texte
  cx.save();cx.translate(W/2,10);cx.transform(1,0,-.14,1,0,0);
  txt(a.d.ultName,0,0,k<.25?20+k*60:30,'#ffd23f','center','#ff2e93');cx.restore();
  const w=Math.round(Math.sin(G.t*40)*1.2);
  txt('ゴゴゴゴ',16+w,176,24,'#ff2e93','left','#0d0718');txt('ゴゴゴゴ',W-16-w,176,24,d.glow,'right','#0d0718');
}
function render(){
  cx.save();
  if(G.shake>0)cx.translate(Math.round(rnd(-1,1)*G.shake),Math.round(rnd(-1,1)*G.shake));
  const stage=foe?(G.mode==='menu'?0:foe.d.bg):0;
  const camX=me&&foe?(me.x+foe.x)/2-W/2:0;
  drawBG(stage,G.t,camX);
  if(me&&foe){
    drawBolts();
    G.ghosts.forEach(g=>{human(g.a,g.life/g.max*.42,true)});
    [me,foe].sort((p,q)=>(p.y-q.y)||(p.x-q.x)).forEach(drawFighter);
    G.proj.forEach(p=>{disc(p.x,p.y,p.r+3,mix(p.col,'#0a0614',.5));disc(p.x,p.y,p.r+1,p.col);disc(p.x,p.y,p.r-2,'#fff');
      for(let i=1;i<5;i++){cx.globalAlpha=.5/i;rect(p.x-p.vx*.012*i-2,p.y-2+Math.sin(G.t*30+i)*2,4,4,p.col)}cx.globalAlpha=1});
    drawBeam();
    G.rings.forEach(r=>{cx.globalAlpha=r.t/r.max;ring(r.x,r.y,r.r,r.col,2);cx.globalAlpha=1});
    G.bursts.forEach(drawBurst);
  }
  G.parts.forEach(p=>{cx.globalAlpha=Math.min(1,p.life/p.max*1.5);cx.fillStyle=p.col;cx.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz)});cx.globalAlpha=1;
  G.words.forEach(w=>txt(w.s,w.x,w.y-(1-w.t/w.max)*18,13,w.col,'center','#0d0718'));
  drawBGFront(stage,G.t);
  cx.drawImage(VIG,0,0);
  if(G.timeStop>0){
    cx.fillStyle='rgba(110,150,230,.2)';cx.fillRect(0,0,W,H);
    const r=30+(3.6-G.timeStop)*40;cx.globalAlpha=Math.max(0,1-(3.6-G.timeStop)*1.4);
    ring(me.x,GROUND-2,r,'#35e0ff',3);cx.globalAlpha=1;
    // aiguille d'horloge
    const an=G.t*5;line(me.x,GROUND-60,me.x+Math.cos(an)*9,GROUND-60+Math.sin(an)*9,2,'#35e0ff');ring(me.x,GROUND-60,10,'#35e0ff',1);
  }
  if(G.flash>0){cx.globalAlpha=Math.min(.8,G.flash*4);cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.globalAlpha=1}
  if(G.mode!=='menu')drawHUD();
  if(G.mode==='pose')drawPose();
  if(G.msgT>0&&G.mode!=='pose'){
    const s=Math.min(1,G.msgT*3);
    cx.globalAlpha=s;
    txt(G.msg,W/2,76,G.msg.length>9?26:38,'#ffd23f','center','#ff2e93');
    if(G.sub)txt(G.sub,W/2,118,15,'#f6ecff','center','#0d0718');
    cx.globalAlpha=1;
  }
  cx.restore();
}
/* ===== 8 : boucle, manches, commandes, menu ===== */
function startRound(){
  foe=mk(FOES[G.round],true);
  Object.assign(me,{x:92,y:GROUND,vx:0,vy:0,f:1,hp:Math.min(me.max,me.hp+30),st:'idle',stT:0,atk:null,standOn:false,standT:0,
    frozen:0,inv:0,boost:0,comboN:0,comboT:0,guarding:false,queued:false,air:false});
  me.trail=me.hp;
  G.proj=[];G.bolts=[];G.beam=null;G.timeStop=0;G.slow=1;G.slowT=0;G.ghosts=[];
  G.mode='intro';G.msg='MANCHE '+(G.round+1);G.sub=foe.d.name;G.msgT=1.9;sfx.gong();
}
function newGame(){me=mk(FIGHTERS[G.picked],false);G.round=0;startRound()}
function endScreen(win){
  G.mode='over';G.won=win;
  const full=win&&G.round>=FOES.length-1;
  $('endT').textContent=win?(full?'VICTOIRE !':'K.O. !'):'DÉFAITE';
  $('endS').textContent=win?(full?'Les trois porteurs de Stand sont à terre. Tu es le plus fort.':'Manche gagnée. Un nouvel adversaire arrive.'):'Ton adversaire t\'a eu. Relève-toi et recommence la manche.';
  $('again').textContent=win?(full?'MENU':'MANCHE SUIVANTE'):'REVANCHE';
  $('end').hidden=false;
}
$('again').addEventListener('click',()=>{
  $('end').hidden=true;
  if(G.won){
    if(G.round>=FOES.length-1){toMenu();return}
    G.round++;startRound();
  }else{me.hp=me.max;me.ult=0;startRound()}
});
function toMenu(){G.mode='menu';previewFighters();$('menu').hidden=false}
function previewFighters(){
  me=mk(FIGHTERS[G.picked],false);foe=mk(FOES[G.round>=FOES.length?0:0],true);
  me.x=112;foe.x=272;me.standOn=true;foe.standOn=true;me.standT=1;foe.standT=1;
}

function partsStep(dt){
  G.parts=G.parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;return p.life>0});
  G.words=G.words.filter(w=>(w.t-=dt)>0);
  G.rings=G.rings.filter(r=>{r.t-=dt;r.r+=dt*90;return r.t>0});
  G.bursts=G.bursts.filter(b=>(b.t-=dt)>0);
  G.ghosts=G.ghosts.filter(g=>(g.life-=dt)>0);
}
function clearEdges(){inp.jump=inp.hit=inp.stand=inp.dash=inp.ult=false}

function tick(rdt){
  G.t+=rdt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-rdt*26);
  if(G.flash>0)G.flash-=rdt;
  if(G.msgT>0)G.msgT-=rdt;
  if(G.slowT>0){G.slowT-=rdt;if(G.slowT<=0)G.slow=1}
  if(!me||!foe)return;
  if(G.mode==='menu'){me.t+=rdt;foe.t+=rdt;standStep(me,rdt);standStep(foe,rdt);partsStep(rdt);clearEdges();return}
  if(G.hitstop>0){G.hitstop-=rdt;return}
  const dt=rdt*G.slow;
  partsStep(dt);
  const pairs=[[me,foe],[foe,me]];
  if(G.mode==='intro'){
    pairs.forEach(([a])=>{stepState(a,dt);standStep(a,dt)});
    if(G.msgT<=0){G.mode='fight';G.msg='COMBAT !';G.sub='';G.msgT=.7}
    clearEdges();
  }else if(G.mode==='fight'){
    updPlayer(me,foe,dt);updFoe(foe,me,dt);
    pairs.forEach(([a,o])=>{
      if(a.frozen>0)return;
      stepState(a,dt);
      if(a.st==='atk')atkStep(a,o,dt);
      phys(a,dt);standStep(a,dt);
    });
    sep(me,foe);updProj(dt);updBolts(dt);updBeam(dt);
    if(G.timeStop>0){
      G.timeStop-=dt;G.tsTick-=dt;
      if(G.tsTick<=0){sfx.tick();G.tsTick=.5}
      if(G.timeStop<=0)G.timeStop=0;
    }
    musicTick(dt,G.round,foe.hp<foe.max*.5||me.hp<30);
    if(me.hp<=0||foe.hp<=0){G.mode='ko';G.ko=2.1;G.msg='K.O.';G.msgT=2.1;G.sub=''}
  }else if(G.mode==='pose'){
    me.t+=dt;me.stT+=dt;standStep(me,dt);G.pose-=rdt;
    if(G.pose<=0)finishUlt();
    clearEdges();
  }else if(G.mode==='ko'){
    pairs.forEach(([a])=>{stepState(a,dt);phys(a,dt);standStep(a,dt)});
    G.ko-=rdt;
    if(G.ko<=0)endScreen(foe.hp<=0);
    clearEdges();
  }
}

/* ---------- commandes ---------- */
const HELD={left:1,right:1,guard:1};
document.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k;
  const on=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
    el.classList.add('down');inp[k]=true;sndInit();if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume()};
  const off=e=>{el.classList.remove('down');if(HELD[k])inp[k]=false};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',
  KeyJ:'hit',KeyK:'stand',KeyL:'ult',KeyS:'guard',ShiftLeft:'guard',KeyU:'dash',KeyE:'dash'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){e.preventDefault();sndInit();inp[k]=true}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k&&HELD[k])inp[k]=false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('.pick'))e.preventDefault()},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){inp.left=inp.right=inp.guard=false}});

/* ---------- menu ---------- */
const pk=$('pick');
Object.entries(FIGHTERS).forEach(([key,f])=>{
  const b=document.createElement('button');
  b.innerHTML=f.name+'<small>Stand : '+f.stand+'<br>Ultime : '+f.ultName+'</small>';
  if(key===G.picked)b.className='on';
  b.addEventListener('click',()=>{G.picked=key;[...pk.children].forEach(c=>c.classList.remove('on'));b.className='on';previewFighters()});
  pk.appendChild(b);
});
$('go').addEventListener('click',()=>{sndInit();$('menu').hidden=true;newGame()});
$('snd').addEventListener('click',e=>{
  e.stopPropagation();sndInit();SND.on=!SND.on;$('snd').classList.toggle('off',!SND.on);
});

/* ---------- boucle ---------- */
buildBG();previewFighters();
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  tick(dt);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
