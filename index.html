<style>
/* Layout: arène 16:9 en haut, manette tactile dessous (portrait) ou par-dessus (paysage). Look: manga acide, aplats violet/magenta/jaune, contours épais. */
:root{
  --ink:#120a1f;
  --violet:#3b1d6e;
  --magenta:#ff2e93;
  --gold:#ffd23f;
  --cyan:#35e0ff;
  --paper:#f6ecff;
  --display:'Bangers','Impact','Arial Black',sans-serif;
  --body:'Rubik','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{touch-action:manipulation;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--paper);font-family:var(--body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px;
}
#stage{position:relative;width:100%;max-width:min(100%,calc((100vh - 250px)*1.7778));margin:6px auto 0;aspect-ratio:16/9;border:3px solid var(--gold);border-radius:6px;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--magenta)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:12px;background:rgba(18,10,31,.88)}
.overlay[hidden]{display:none!important}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,64px);letter-spacing:2px;margin:0;line-height:.95;color:var(--gold);text-shadow:3px 3px 0 var(--magenta),6px 6px 0 var(--violet);transform:skew(-6deg)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,34px);margin:0;color:var(--cyan);letter-spacing:1px}
p.sub{margin:0;font-size:clamp(11px,3vw,14px);opacity:.85;max-width:34ch;line-height:1.35}
.btn{font-family:var(--display);font-size:clamp(18px,5vw,26px);letter-spacing:1px;color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:8px;padding:8px 22px;box-shadow:4px 4px 0 var(--magenta);cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--magenta)}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(100%,420px)}
.pick button{font-family:var(--body);font-weight:700;font-size:12px;color:var(--paper);background:var(--violet);border:2px solid var(--paper);border-radius:6px;padding:8px 6px;line-height:1.25}
.pick button small{display:block;font-weight:400;opacity:.8;font-size:10px}
.pick button.on{background:var(--magenta);border-color:var(--gold)}
#pad{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.grp{display:grid;gap:8px}
#dirs{grid-template-columns:repeat(3,48px);gap:5px}
#acts{grid-template-columns:repeat(3,60px);align-items:center;gap:6px}
#ultk{grid-column:1 / span 3;border-radius:30px;height:44px}
.k{height:56px;border-radius:50%;border:3px solid var(--paper);background:var(--violet);color:var(--paper);font-family:var(--display);font-size:12px;letter-spacing:0;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;overflow:hidden;white-space:nowrap}
#dirs .k{border-radius:14px;height:70px;font-size:28px}
.k.down{background:var(--magenta);transform:scale(.94)}
.k.gold{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.k.gold.down{background:var(--cyan)}
.k.dim{opacity:.35}
.k.ready{animation:pulse .6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 var(--cyan)}to{box-shadow:0 0 0 8px transparent}}
@media (orientation:landscape){
  body{padding:0;display:block}

#grid{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-content:start;padding:2px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 2px;background:var(--violet);border:2px solid #6a4aa0;border-radius:6px;color:var(--paper);font-family:var(--body);font-size:8px;font-weight:700;min-width:0}
.cell canvas{width:100%;max-width:44px;aspect-ratio:1;image-rendering:pixelated;display:block}
.cell span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.on{border-color:var(--gold);background:var(--magenta)}
#go{flex:none}
.btn.alt{font-size:15px;background:var(--paper);box-shadow:4px 4px 0 var(--violet)}
@media (orientation:landscape){
  body.menu #stage{display:none}
  #select{position:fixed;inset:0;z-index:30;background:var(--ink);padding:8px max(16px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
}

#diff{display:flex;gap:6px;flex:none}

#diff button.on{background:var(--gold);color:var(--ink);border-color:var(--paper)}
/* taille de l'arène et des boutons selon la hauteur visible */

#stage{max-width:min(100%,calc((100vh - var(--padh) - 14px)*1.7778))}
#pad{flex:none;gap:8px;padding-top:2px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
#dirs{grid-template-columns:repeat(3,calc(var(--u)*.76));gap:5px}
#dirs .k{height:calc(var(--u)*1.2);font-size:calc(var(--u)*.5)}
#acts{grid-template-columns:repeat(3,calc(var(--u)*.98));gap:6px}
.k{height:var(--u);font-size:clamp(9px,calc(var(--u)*.22),17px)}

#tabs{display:flex;gap:5px;flex:none}
#tabs button{flex:1;font-family:var(--display);font-size:12px;letter-spacing:.5px;color:var(--paper);background:var(--violet);border:2px solid #6a4aa0;border-radius:8px;padding:5px 2px;min-width:0;white-space:nowrap}
#tabs button.on{background:var(--gold);color:var(--ink);border-color:var(--paper)}
.cell.foe{border-color:var(--cyan);background:#16466b}
.cell.on.foe{border-color:var(--gold)}
/* écran de sélection : tout reste accessible sur les petits écrans */
body.menu #stage{max-width:min(100%,calc(30vh*1.7778))}
@supports (height:100dvh){body.menu #stage{max-width:min(100%,calc(30dvh*1.7778))}}
#info{min-height:0;padding:4px 8px}
#infoName{font-size:18px}
#infoPow{font-size:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#grid{flex:1 1 auto;min-height:96px}
#select{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#foot{flex:none;display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:var(--ink);padding-top:4px;z-index:2}
#go{flex:none}
@media (max-height:480px) and (orientation:portrait){body.menu #stage{max-width:min(100%,calc(22vh*1.7778))}#infoStand{display:none}}
#gorow{display:flex;gap:8px}
#gorow .btn{flex:1;padding-left:8px;padding-right:8px}
#gorow #online{flex:.8;font-size:clamp(14px,4vw,20px)}
#lobby{position:fixed;inset:0;z-index:40;background:rgba(6,0,18,.92);display:flex;align-items:center;justify-content:center;padding:16px}
#lobby[hidden]{display:none}
#lbox{width:min(100%,420px);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
#lbox h2{font-family:var(--display);font-size:30px;color:var(--gold);letter-spacing:2px;margin:0}
#lmsg{color:var(--paper);font-size:14px;min-height:2.6em;margin:0}
#lcode{font-family:var(--display);font-size:56px;letter-spacing:10px;color:var(--cyan,#35e0ff);min-height:1em}
#lin{font-family:var(--display);font-size:28px;text-align:center;letter-spacing:8px;text-transform:uppercase;padding:8px;border-radius:8px;border:3px solid #6a4aa0;background:#1a0f2e;color:var(--paper)}
#lbtns{display:flex;gap:8px}#lbtns .btn{flex:1}
</style>

<script>
/* ===== 2 : noyau, couleurs, primitives de dessin pixel ===== */
const W=384,H=216,GROUND=178;
const WORLD=768;   // largeur réelle de l'arène (la caméra en montre W)
const cv=document.getElementById('c'),cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* couleurs : mélange avec memo */
const _m={};
function mix(c,o,k){
  const key=c+o+k;if(_m[key])return _m[key];
  const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const a=p(c),b=p(o);
  return _m[key]='#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('');
}
const dk=(c,k=.38)=>mix(c,'#0a0614',k);
const lt=(c,k=.28)=>mix(c,'#ffffff',k);

function rect(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h)}
function line(x0,y0,x1,y1,th,c){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=x1-x0,dy=y1-y0,n=Math.max(Math.abs(dx),Math.abs(dy),1),o=th>>1;
  cx.fillStyle=c;
  for(let i=0;i<=n;i++)cx.fillRect(Math.round(x0+dx*i/n)-o,Math.round(y0+dy*i/n)-o,th,th);
}
/* membre : contour, remplissage, ombre côté arrière, reflet côté avant */
function limb(x0,y0,x1,y1,th,c,f){
  line(x0,y0,x1,y1,th+2,'#0d0718');
  line(x0,y0,x1,y1,th,c);
  const o=Math.max(1,th>>1);
  // volume : terminateur sombre côté arrière, demi-teinte, lumière côté avant, éclat spéculaire
  line(x0-f*o+f,y0,x1-f*o+f,y1,1,dk(c,.5));
  if(th>=5)line(x0-f*(o-1)+f,y0,x1-f*(o-1)+f,y1,1,dk(c,.22));
  if(th>=4)line(x0+f*(o-1),y0,x1+f*(o-1),y1,1,lt(c,.24));
  if(th>=5){const mx=(x0*.4+x1*.6),my=(y0*.4+y1*.6);rect(mx+f*(o-2),my-1,1,2,lt(c,.6))}
  // occlusion ambiante à l'articulation
  if(th>=4){cx.globalAlpha=.28;rect(x0-(th>>1),y0-(th>>1),th,th,'#0d0718');cx.globalAlpha=1}
}
function disc(x,y,r,c){
  cx.fillStyle=c;
  for(let j=-r;j<=r;j++){const w=Math.floor(Math.sqrt(r*r-j*j));cx.fillRect(Math.round(x-w),Math.round(y+j),w*2+1,1)}
}
function ring(x,y,r,c,th=2){
  cx.fillStyle=c;
  const n=Math.max(12,r*3);
  for(let i=0;i<n;i++){const a=i/n*6.2832;cx.fillRect(Math.round(x+Math.cos(a)*r),Math.round(y+Math.sin(a)*r*.55),th,th)}
}
function shadow(x,gy,w,a=.5,h=0){
  const k=clamp(1-h/130,.25,1);w*=k;a*=k;
  // ombre portée allongée (lumière venant de la gauche) puis noyau de contact
  for(let j=-3;j<=3;j++){const ww=Math.round(w*1.5*Math.sqrt(1-(j*j)/12.25));cx.fillStyle='rgba(6,2,14,'+(a*.4)+')';cx.fillRect(Math.round(x+w*.28-ww/2),gy+j+1,ww,1)}
  for(let j=-3;j<=3;j++){const ww=Math.round(w*Math.sqrt(1-(j*j)/12.25));cx.fillStyle='rgba(6,2,14,'+(a*.9)+')';cx.fillRect(Math.round(x-ww/2),gy+j+1,ww,1)}
}

/* ===== Roster : 30 combattants originaux, chacun avec son Stand et son pouvoir ===== */
/* look : [peau, cheveux, haut, pantalon, bottes, accent, coiffure, corpulence, manteau, écharpe]
   stand : [corps, accent, lueur, peau, crête]   stats : [vitesse, vie, force, comportement IA] */
function mkChar(name,stand,pw,desc,L,S,T){
  return{name,stand,pw,desc,ult:pw.k,ultName:pw.n,
    skin:L[0],hair:L[1],top:L[2],pants:L[3],boot:L[4],acc:L[5],hairStyle:L[6],bulk:L[7],coat:L[8],scarf:L[9],
    st:{body:S[0],acc:S[1],glow:S[2],skin:S[3],crest:S[4]},
    spd:T[0],hpm:T[1],pow:T[2],trait:T[3],dmg:7,rate:.7+T[0]*.3};
}
const ROSTER=[
 mkChar('CRONOS','TIC-TAC',{k:'freeze',type:'time',dur:3.6,n:"LE TEMPS S'ARRÊTE"},
  "Arrête le temps 3,6 s : l'adversaire est figé, tes coups font double et tombent d'un coup à la reprise.",
  ['#f0bf98','#1b1a3a','#23203a','#2b2a52','#100d1c','#ffd23f',0,1,'#1a1830',null],
  ['#3c58d6','#ffd23f','#35e0ff','#9db8ff','clock'],[1,1,1,'none']),
 mkChar('MIRELLA','ROSE NOIRE',{k:'beam',col:'#ff2e93',h:1,dmg:36,n:'RAYON ÉCARLATE'},
  "Un rayon écarlate traverse l'arène. Saute pour l'éviter.",
  ['#e8b48c','#c0295e','#2f8a66','#3a2d5c','#14101f','#ffd23f',1,.92,null,'#ff5c9a'],
  ['#e0407f','#ffe7f1','#ff2e93','#ffb3d1','thorn'],[1.05,.95,1.05,'shoot']),
 mkChar('KAÏTO VANCE','HORLOGE VIDE',{k:'freeze',type:'skip',dur:1.6,n:'LE TEMPS EFFACÉ'},
  "Efface 1,6 s de temps : l'adversaire ne voit rien venir et tes coups font double.",
  ['#cdd6f0','#e8e8ff','#2a1d4d','#1c1535','#0b0818','#35e0ff',2,.95,'#1b1236',null],
  ['#2a2a4a','#ff2e93','#ff5cc8','#8a8ab0','crown'],[1.05,.95,1,'blink']),
 mkChar('LUNA FERRO','SABLIER',{k:'rewind',n:'RETOUR EN ARRIÈRE'},
  "Remonte le temps : tu retrouves la vie que tu avais il y a 4 secondes et repousses l'adversaire.",
  ['#f6d3b8','#8a8aa8','#4a3a6a','#2a2440','#14101f','#ffd23f',2,.9,null,'#ffd23f'],
  ['#c9a64a','#fff1c0','#ffe27a','#f0dca0','halo'],[1,1,.95,'none']),
 mkChar('DOC MARROW','SUTURE',{k:'heal',amt:42,n:'CHIRURGIE ÉCLAIR'},
  "Recoud tes blessures : tu regagnes environ 40 % de ta vie et ta jauge de Stand se remplit.",
  ['#eac9a8','#222222','#e8f0ee','#2e5a52','#101a18','#ff4a4a',4,1,'#e8f0ee',null],
  ['#4aa88a','#e8fff6','#7affd0','#b8f0dc','thorn'],[.9,1.1,.9,'none']),
 mkChar('BRUTUS KANE','GRANITE',{k:'strike',smash:true,dmg:40,col:'#c8c8d8',n:'POING DE GRANIT'},
  "Fonce et écrase l'adversaire d'un poing de granit (40 dégâts, grosse projection).",
  ['#d49b78','#3a2a1a','#8a2f2f','#4d4d57','#1b1417','#ffd23f',3,1.22,null,null],
  ['#8a8f9c','#d0d0e0','#ffffff','#b4b8c4','horn'],[.85,1.15,1.1,'lunge']),

/* ===== 3 : squelette, poses, dessin du combattant et du Stand ===== */
function fr(x,y,f,ox,oy,w,h,c){rect(x+f*ox-(f<0?w:0),y+oy,w,h,c)}

function mkP(lean,tilt,aB,aF,lB,lF,sink){return{lean,tilt,aB,aF,lB,lF,sink:sink||0}}

/* extension d'une attaque : -1..0 armement, 0..1 frappe, retombe ensuite */
function atkExt(a){
  const k=a.atk;if(!k)return 0;
  const p=a.stT,w=k.w,ac=k.a,tot=k.w+k.a+k.r;
  if(p<w)return -ease(p/w);
  if(p<w+ac)return ease((p-w)/ac);
  return 1-ease((p-w-ac)/(tot-w-ac));
}
function walkLegs(ph){
  const s1=Math.sin(ph),s2=Math.sin(ph+3.1416);
  return [[s2*.7-.05,s2*.7-.05-.55*(.5+.5*Math.cos(ph+3.1416))],[s1*.7+.15,s1*.7+.15-.55*(.5+.5*Math.cos(ph))]];
}
function getPose(a){
  const t=a.t,p=a.stT;
  const br=Math.sin(t*3.2)*.03;
  if(a.ducking&&(a.st==='idle'||a.st==='walk'||a.st==='block'))return mkP(.55,0,[1.2,2.7],[1.4,2.9],[1.5,-1.2],[1.5,.9],0);
  switch(a.st){
  case 'walk':{
    const dirn=(a.vx*a.f>=0)?1:-1,ph=t*11*dirn,L=walkLegs(ph);
    return mkP(.1+br,0,[.7,2.2],[.95,2.35],L[0],L[1]);
  }
  case 'jump':
    return a.vy<0?mkP(.1,0,[.5,1.9],[.8,2.2],[.2,-.9],[.9,-.3]):mkP(.05,0,[.4,1.7],[.7,2.0],[-.1,-.1],[.5,.15]);
  case 'atk':{
    if(!a.atk)return mkP(.1,0,[.7,2.2],[.95,2.35],[-.45,-.25],[.5,.15]);
    const e=atkExt(a),k=a.atk,ep=Math.max(e,0),en=Math.max(-e,0);
    if(a.standLock&&k.id<2)return mkP(.14+br,0,[.8,2.2],[1.0,2.3],[-.35,-.2],[.4,.1]);   // le Stand frappe à sa place
    if(k.id===2){ // coup de pied
      return mkP(.05-.22*ep,-.1*ep,[.5,2.0],[.9,2.3],[-.5-.1*ep,-.3],[lerp(.45,1.45,ep)-en*.5,lerp(.15,1.5,ep)-en*.9]);
    }
    if(k.id===9){ // pose de commande du Stand
      return mkP(.18,0,[.6,2.3],[1.5,1.55],[-.5,-.3],[.7,.2]);
    }
    const front=k.id===0;
    const sA=ep>0?lerp(.9,1.57,ep):lerp(.9,.25,en),eA=ep>0?lerp(2.3,1.57,ep):lerp(2.3,3.0,en);
    const guard=[.8,2.3];
    return mkP(.08+(front?.32:.5)*ep-.12*en,0,front?[.7,2.2]:[sA,eA],front?[sA,eA]:[.95,2.35],[-.45-.35*ep,-.25],[.5+.5*ep,.15]);
  }
  case 'hurt':{
    const k=ease(p/.08);
    return mkP(lerp(.1,-.32,k),lerp(0,-.35,k),[-.4,-.1],[.1,.6],[.2,.55],[.55,.3],0);
  }
  case 'block':
    return mkP(.18,0,[1.0,2.7],[1.2,2.95],[-.7,-.25],[.9,.12]);
  case 'dash':
    return mkP(.62,.1,[-.8,-.9],[-.5,-.7],[-.9,-.5],[1.15,.35]);
  case 'down':case 'ko':{
    const k=a.st==='ko'?1:ease(p/.28);
    return mkP(lerp(.1,-1.5,k),lerp(0,-.3,k),[-1.2,-1.0],[-1.0,-.8],[1.4,1.45],[1.35,1.4],lerp(0,-1,k));
  }
  case 'getup':{
    const k=ease(p/a.stDur);
    return mkP(lerp(-1.5,.1,k),0,[lerp(-1.2,.7,k),lerp(-1,2.2,k)],[lerp(-1,.95,k),lerp(-.8,2.35,k)],[lerp(1.4,-.45,k),lerp(1.45,-.25,k)],[lerp(1.35,.5,k),lerp(1.4,.15,k)]);
  }
  case 'pose':{
    const k=ease(p/.35);
    return mkP(lerp(.1,-.28,k),lerp(0,-.15,k),[.5,1.6],[lerp(.9,2.7,k),lerp(2.3,2.85,k)],[-.7,-.3],[.9,.2]);
  }
  default: // idle : garde, respiration
    return mkP(.1+br,0,[.7+Math.sin(t*3)*.04,2.2],[.95,2.35+Math.sin(t*3.4)*.05],[-.45,-.25],[.5+br*2,.15],Math.sin(t*3.2)>0?0:0);
  }
}

function rigJ(X,Y,f,P,S){
  const T=12*S,SH=12*S,TO=16*S,UA=9*S,FA=9*S;
  const leg=a=>{const kx=Math.sin(a[0])*T*f,ky=Math.cos(a[0])*T;return[kx,ky,kx+Math.sin(a[1])*SH*f,ky+Math.cos(a[1])*SH]};
  const lB=leg(P.lB),lF=leg(P.lF),low=Math.max(lB[3],lF[3]);
  const hx=X,hy=Y-low-P.sink*3;
  const sx=hx+Math.sin(P.lean)*TO*f,sy=hy-Math.cos(P.lean)*TO;
  const arm=a=>{const ex=sx+Math.sin(a[0])*UA*f,ey=sy+Math.cos(a[0])*UA;return[ex,ey,ex+Math.sin(a[1])*FA*f,ey+Math.cos(a[1])*FA]};
  return{hx,hy,sx,sy,lB:lB.map((v,i)=>v+(i%2?hy:hx)),lF:lF.map((v,i)=>v+(i%2?hy:hx)),aB:arm(P.aB),aF:arm(P.aF),
    hd:[sx+Math.sin(P.lean+P.tilt)*8*S*f,sy-Math.cos(P.lean+P.tilt)*8*S]};
}

function hairDraw(hx,hy,f,col,style,t,sway){
  const o='#0d0718',h2=lt(col,.22);
  if(style===1){ // queue de cheval
    line(hx-f*4,hy-3,hx-f*(9+sway),hy+4,4,o);line(hx-f*4,hy-3,hx-f*(9+sway),hy+4,2,col);
    line(hx-f*9,hy+4,hx-f*(12+sway*2),hy+12,4,o);line(hx-f*9,hy+4,hx-f*(12+sway*2),hy+12,2,col);
  }
  if(style===2){ // mi-long plaqué en arrière
    line(hx-f*5,hy-5,hx-f*(9+sway),hy+7,5,o);line(hx-f*5,hy-5,hx-f*(9+sway),hy+7,3,col);
  }
  if(style===5){rect(hx-6,hy-6,12,2,o);rect(hx-5,hy-6,10,1,col);return}
  if(style===6){
    line(hx-f*4,hy-7,hx-f*6,hy-14,4,o);line(hx,hy-8,hx-f*2,hy-17,4,o);line(hx+f*3,hy-8,hx+f*4,hy-16,4,o);
    line(hx-f*4,hy-7,hx-f*6,hy-13,2,col);line(hx,hy-8,hx-f*2,hy-16,2,col);line(hx+f*3,hy-8,hx+f*4,hy-15,2,col);
    rect(hx-3,hy-8,6,3,col);return}
  if(style===4){rect(hx-6,hy-12,12,6,o);rect(hx-5,hy-11,10,4,col);rect(hx-6,hy-8,12,4,o);rect(hx-5,hy-7,10,2,col);rect(hx-3,hy-11,5,1,h2);return}
  rect(hx-6,hy-8,12,6,o);rect(hx-5,hy-7,10,4,col);rect(hx-3,hy-7,5,1,h2);
  const sp=style===3?[[-5,-8,-8,-15],[-1,-8,-2,-17],[3,-8,6,-16],[5,-5,10,-10],[-6,-4,-10,-8]]:
           style===0?[[-3,-8,-5,-14],[0,-8,1,-16],[3,-8,6,-14]]:[];
  sp.forEach(s=>{line(hx+f*s[0],hy+s[1],hx+f*s[2],hy+s[3],4,o);line(hx+f*s[0],hy+s[1],hx+f*s[2],hy+s[3],2,col)});
}

/* dessin d'un humanoïde ; alpha pour images rémanentes */
function human(a,alpha,ns){
  const d=a.d,f=a.f,S=d.bulk,P=getPose(a),J=rigJ(a.x,a.y,f,P,S);
  const lying=a.st==='ko'||a.st==='down'||a.st==='getup';
  cx.globalAlpha=alpha==null?1:alpha;
  if(!ns)shadow(a.x,GROUND,lying?44:28,.55*(alpha==null?1:alpha),GROUND-a.y);
  const th=Math.round(5*S),sway=Math.sin(a.t*6)*2+(a.vx||0)*-.02*f;
  const pantsB=dk(d.pants,.3),topB=dk(d.top,.3),skinB=dk(d.skin,.25);
  gearBack(a,J,f,lying);
  // manteau (derrière)
  if(d.coat){
    const cs=clamp(-(a.vx||0)*f*.05,-5,7)+Math.sin(a.t*3)*1.2;
    limb(J.hx-f*2,J.hy-1,J.hx-f*(6+cs),J.hy+17-(lying?12:0),9,d.coat,f);
  }
  if(d.scarf){
    for(let i=0;i<5;i++){const sx=J.sx-f*(3+i*3),sy=J.sy+1+Math.sin(a.t*8+i)*1.5+i*.6;rect(sx-1,sy-1,4,4,'#0d0718');}
    for(let i=0;i<5;i++){const sx=J.sx-f*(3+i*3),sy=J.sy+1+Math.sin(a.t*8+i)*1.5+i*.6;rect(sx,sy,2,2,i%2?d.scarf:lt(d.scarf,.2));}
  }
  // bras arrière
  limb(J.sx,J.sy,J.aB[0],J.aB[1],th,topB,f);limb(J.aB[0],J.aB[1],J.aB[2],J.aB[3],th-1,skinB,f);
  rect(J.aB[2]-2,J.aB[3]-2,4,4,'#0d0718');rect(J.aB[2]-1,J.aB[3]-1,2,2,skinB);
  // jambe arrière
  limb(J.hx,J.hy,J.lB[0],J.lB[1],th+1,pantsB,f);limb(J.lB[0],J.lB[1],J.lB[2],J.lB[3],th,pantsB,f);
  limb(J.lB[2]-f,J.lB[3]-1,J.lB[2]+f*5,J.lB[3],4,dk(d.boot,.1),f);
  // torse
  limb(J.hx,J.hy,J.sx,J.sy,Math.round(11*S),d.top,f);
  fr(J.hx,J.hy,f,-5,-3,11,2,d.acc);                                     // ceinture
  limb(J.sx-f*1,J.sy+2,J.hx-f*1,J.hy-2,3,d.coat||lt(d.top,.12),f);     // pan central
  rect(J.sx-1,J.sy+3,2,2,d.acc);
  gearBody(a,J,f,S);
  // tête
  const hx=J.hd[0],hy=J.hd[1],hurt=a.st==='hurt'||lying;
  rect(hx-6,hy-6,12,12,'#0d0718');rect(hx-5,hy-5,10,10,d.skin);rect(hx-5,hy+2,10,3,dk(d.skin,.15));
  hairDraw(hx,hy,f,d.hair,d.hairStyle,a.t,sway);
  if(hurt){fr(hx,hy,f,1,-2,4,1,'#0d0718');fr(hx,hy,f,2,3,3,2,'#6a1a2a')}
  else{
    fr(hx,hy,f,1,-2,4,3,'#ffffff');fr(hx,hy,f,3,-2,2,3,'#0d0718');
    fr(hx,hy,f,0,-4,5,1,'#0d0718');fr(hx,hy,f,1,3,3,1,dk(d.skin,.5));
  }
  gearHead(a,hx,hy,f,hurt);
  // jambe avant
  limb(J.hx,J.hy,J.lF[0],J.lF[1],th+1,d.pants,f);limb(J.lF[0],J.lF[1],J.lF[2],J.lF[3],th,d.pants,f);
  limb(J.lF[2]-f,J.lF[3]-1,J.lF[2]+f*5,J.lF[3],4,d.boot,f);
  // bras avant
  limb(J.sx,J.sy,J.aF[0],J.aF[1],th,d.top,f);limb(J.aF[0],J.aF[1],J.aF[2],J.aF[3],th-1,d.skin,f);
  rect(J.aF[2]-3,J.aF[3]-3,6,6,'#0d0718');rect(J.aF[2]-2,J.aF[3]-2,4,4,d.skin);rect(J.aF[2]-2,J.aF[3]-2,4,1,lt(d.skin,.25));
  gearHands(a,J,f);
  cx.globalAlpha=1;
  a.fist=[J.aF[2],J.aF[3]];a.head=[hx,hy];
}

function standPose(a){
  const t=a.t,m=a.sMode,fl=Math.sin(t*3);
  if(m==='punch'){
    const e=Math.max(atkExt(a),0),id=a.atk?a.atk.id:0,sA=lerp(.9,1.57,e),eA=lerp(2.3,1.57,e);
    if(id===2)return mkP(.06-.2*e,0,[.5,2.0],[.9,2.3],[-.5,-.3],[lerp(.45,1.45,e),lerp(.15,1.5,e)]);
    return mkP(.12+.3*e,0,id===0?[sA,eA]:[.7,2.2],id===0?[.95,2.35]:[sA,eA],[-.4-.3*e,-.2],[.5+.4*e,.1]);
  }
  if(m==='rush'){
    const ph=t*30,e1=.5+.5*Math.sin(ph),e2=.5+.5*Math.sin(ph+3.14);
    return mkP(.28,0,[lerp(.5,1.55,e2),lerp(2.0,1.57,e2)],[lerp(.5,1.55,e1),lerp(2.0,1.57,e1)],[-.5,-.2],[.7,.1]);
  }
  if(m==='guard')return mkP(.2,0,[1.0,2.8],[1.2,2.95],[-.4,-.2],[.4,.1]);
  if(m==='pose')return mkP(-.2,0,[.5,1.6],[2.7,2.85],[-.6,-.3],[.7,.2]);
  if(m==='hurt')return mkP(-.2,-.2,[-.4,-.1],[.0,.5],[.2,.4],[.4,.2]);
  return mkP(.1+fl*.03,0,[.8,2.2+fl*.1],[1.0,2.3-fl*.1],[-.3,-.1],[.35,.1]);
}

function stand(a,alpha){

  cx.globalAlpha=.92*ap;
  F.feat.forEach(n=>drawFeat(n,J,f,t,d,ap,false));
  // queue de serpent / bas du corps
  if(tail){let px=J.hx,py=J.hy+2;for(let i=0;i<9;i++){const nx=px-f*5+Math.sin(t*4+i*.7)*1,ny=py+3.2+Math.sin(t*5+i*.9)*1.5;const w=Math.max(2,bw*.6-i*.9);
      line(px,py,nx,ny,w+2,INK);line(px,py,nx,ny,w,i%2?body:bd);px=nx;py=ny}}
  limb(J.sx,J.sy,J.aB[0],J.aB[1],th,bd,f);limb(J.aB[0],J.aB[1],J.aB[2],J.aB[3],th-1,d.skin,f);

  {

    line(J.sx-f*bw*.4,J.sy+1,mx,my+4,4,INK);line(J.sx+f*bw*.4,J.sy+1,mx,my+4,4,INK);
    line(J.sx-f*bw*.4,J.sy+1,mx,my+3,2,lt(body,.25));line(J.sx+f*bw*.4,J.sy+1,mx,my+3,2,lt(body,.15));

    line(J.sx,J.sy,J.aF[0],J.aF[1],1,d.glow);line(J.sx,J.sy,J.aB[0],J.aB[1],1,d.glow);
    cx.globalAlpha=.92*ap;

  F.feat.forEach(n=>drawFeat(n,J,f,t,d,ap,true));

}

  }else{if(a.st!=='atk')a.ducking=false;if(a.st==='atk'&&inp.hit&&a.atk&&a.atk.id<2&&a.stT>a.atk.w)a.queued=true}
  if(a.st==='atk'&&a.atk&&a.atk.id<9&&inp.dash&&a.dashCd<=0&&a.stT>=a.atk.w+a.atk.a){   // annulation de coup par une esquive
    const dir=mv||-a.f;a.atk=null;a.queued=false;setSt(a,'dash',.22);a.vx=dir*390;a.inv=.22;a.dashCd=.32;ghost(a);sfx.dash();dust(a.x,GROUND,5);
  }
  inp.jump=inp.hit=inp.rush=inp.spec=inp.dash=inp.ult=inp.stand=false;
}
function castUlt(a){
  if(NET.on&&!a.net)NET.cur.ev.push('pose');
  a.ult=0;a.ultUntil=performance.now()+4500;a.standOn=true;a.standT=Math.max(a.standT,.6);G.mode='pose';G.pose=1.5;G.castBy=a;
  setSt(a,'pose',0);a.vx=0;sfx.charge();G.flash=.15;
}
function finishUlt(){
  const a=G.castBy,o=a===me?foe:me;
  if(a.net){netMute(()=>setSt(a,'idle'));G.mode='fight';G.msg=a.d.ultName;G.msgT=1.2;G.sub='';return}
  G.mode='fight';setSt(a,'idle');
  G.msg=a.d.ultName;G.msgT=1.2;G.sub='';
  (POWERS[a.d.pw.k]||POWERS.beam)(a,o,a.d.pw);
}

/* ---------- adversaire ---------- */
function updFoe(a,o,dt){
  if(a.frozen>0)return;
  const free=a.st==='idle'||a.st==='walk'||a.st==='block'||a.st==='jump';
  a.guarding=false;a.cd-=dt;a.ac-=dt;a.aiT-=dt;a.shoot-=dt;
  a.rage=a.hp<a.max*.65&&a.hp>0;
  if(a.rage&&a.standHold<=0)a.standOn=true;else if(!a.rage&&a.standHold<=0)a.standOn=false;
  if(!free||o.hp<=0)return;
  const dx=o.x-a.x,ad=Math.abs(dx),tr=a.d.trait;
  a.f=dx>0?1:-1;
  if(a.ult>=100&&G.mode==='fight'&&Math.random()<dt*1.4*D().spec&&(!RANGED_ULT[a.d.pw.k]||ad>55)){castUlt(a);return}
  const sp=a.d.sp;
  if(sp&&a.specCd<=0&&G.mode==='fight'&&Math.random()<dt*.9*D().spec){
    const k=sp.k;
    const t=sp.ai,ok=t==='range'?ad>60:t==='mid'?(ad>35&&ad<170):t==='close'?ad<70:t==='heal'?a.hp<a.max*.6:t==='react'?(o.st==='atk'&&ad<90):t==='far'?ad>70:t==='any'?true:false;
    if(ok){useSpec(a,o);return}
  }
  if(o.st==='atk'&&ad<58&&a.aiAct!=='guard'&&Math.random()<dt*(.9+a.d.rate*.9)*D().guard){a.aiAct='guard';a.aiT=rnd(.3,.55)}
  if(a.aiAct==='guard'){
    if(a.aiT>0){a.guarding=true;a.st='block';a.vx*=.6;return}
    a.aiAct='';a.aiT=.08;
  }
  if(a.aiT>0){
    if(a.aiAct==='in'){a.vx=a.f*a.d.spd*66*D().spd;a.st='walk'}
    else if(a.aiAct==='out'){a.vx=-a.f*a.d.spd*50*D().spd;a.st='walk'}
    else{a.vx*=.8;a.st='idle'}
    return;
  }
  a.vx=0;a.st='idle';
  if(a.aiAct==='lunge'){a.aiAct='';startAtk(a,2);return}
  if(a.aiAct==='post'){a.aiAct='';startAtk(a,1);return}
  a.aiAct='';
  if(a.cd<=0){
    if(tr==='lunge'&&ad>58&&ad<160){
      a.cd=rnd(2.2,3.4)/a.d.rate*D().ac;setSt(a,'dash',.26);a.vx=a.f*320;ghost(a);sfx.dash();a.aiAct='lunge';return;
    }
    if(tr==='blink'&&ad<130){
      a.cd=rnd(3,4.6);ghost(a);spark(a.x,a.y-24,'#b56cff',14);
      a.x=clamp(o.x-o.f*36,24,WORLD-24);if(Math.abs(a.x-o.x)<18)a.x=clamp(o.x+o.f*36,24,WORLD-24);
      a.f=o.x>a.x?1:-1;spark(a.x,a.y-24,'#b56cff',14);sfx.stand();a.aiAct='post';a.aiT=.17;return;
    }
    if(tr==='bolt'&&ad>30){
      a.cd=rnd(2.6,3.8)/a.d.rate*D().ac;G.bolts.push({x:o.x,t:0,warn:.75,own:a,hit:false,fl:0,dmg:12*pwr(a)});sfx.charge();
      a.aiAct='cast';a.aiT=.5;return;
    }
  }
  if((tr==='shoot'||tr==='blink')&&a.shoot<=0&&ad>90){
    a.shoot=rnd(2,3.2);sfx.stand();
    G.proj.push({x:a.x+a.f*14,y:GROUND-28,vx:a.f*140,r:5,dmg:a.d.dmg*pwr(a),col:a.d.st.glow,own:a,life:3});
    a.aiAct='cast';a.aiT=.35;return;
  }
  if(ad<=46){
    if(a.ac<=0){
      a.ac=rnd(.3,.7)/a.d.rate*D().ac;
      if((a.rage&&Math.random()<.5)||Math.random()<.12)startRush(a);else startAtk(a,0);
    }else{a.aiAct=Math.random()<.35?'out':'idle';a.aiT=rnd(.1,.28)}
  }else{
    a.aiAct=(ad<62&&Math.random()<.2)?'out':'in';a.aiT=rnd(.25,.55);
  }
}

/* ---------- projectiles, foudre, rayon ---------- */
function updProj(dt){
  G.proj=G.proj.filter(p=>{
    if(p.own.frozen>0)return true;
    if(G.timeStop>0&&p.own===G.tsOwner){p.hang=(p.hang||0)+dt;return true}   // le temps est arrêté : même ses couteaux restent suspendus
    const t=p.own===me?foe:me;
    if(p.arm>0)p.arm-=dt;
    if(p.g)p.vy+=p.g*dt;
    if(p.sin){p.age=(p.age||0)+dt;p.y=p.sin.y0+Math.sin(p.age*p.sin.f)*p.sin.a}
    else if(p.vy!==undefined){p.y+=p.vy*dt;if(p.home){p.vy+=((t.y-24)-p.y)*7*dt;p.vy*=Math.max(0,1-3*dt)}}
    if(p.bounce>0&&p.y>GROUND-6&&p.vy>0){p.vy*=-.72;p.bounce--}
    if(p.grow)p.r+=p.grow*dt;
    p.x+=p.vx*dt;p.life-=dt;
    if(p.ret&&!p.back&&p.life<p.retAt){p.back=true;p.vx=-p.vx;p.hitDone=false}
    if(p.bomb){
      if(p.y>=GROUND-4){
        sfx.heavy();G.shake=Math.max(G.shake,5);spark(p.x,GROUND-6,p.col,22);dust(p.x,GROUND,8);
        for(let i=0;i<3;i++)G.rings.push({x:p.x,y:GROUND-4,r:4+i*8,t:.35,max:.35,col:p.col});
        if(t.hp>0&&Math.abs(t.x-p.x)<28&&t.y>=GROUND-22)strike(p.own,t,p.dmg,100,true,true);
        return false;
      }
      return p.life>0;
    }
    const gr=p.wave||p.mine;
    const hitY=gr?(t.y>=GROUND-8):(Math.abs((t.y-24)-p.y)<26);
    if(t.hp>0&&!p.hitDone&&(!p.mine||p.arm<=0)&&Math.abs(t.x-p.x)<p.r+8&&hitY){
      const rs=strike(p.own,t,p.dmg,p.kb||(gr?90:45),!!gr||!!p.launch,!!gr||!!p.launch);spark(p.x,p.y,p.col,14);
      if(rs&&rs!=='block'&&p.onhit)p.onhit(p,t);
      if(p.pierce){p.hitDone=true;return p.life>0}
      return false;
    }
    return p.life>0&&p.x>-30&&p.x<WORLD+30;
  });
}
function updBolts(dt){
  G.bolts=G.bolts.filter(b=>{
    if(b.own.frozen>0)return true;
    b.t+=dt;
    if(b.t>=b.warn&&!b.hit){
      b.hit=true;b.fl=.3;sfx.bolt();G.flash=.2;G.shake=Math.max(G.shake,4);spark(b.x,GROUND-2,'#fff6a0',20);
      const tg=b.own===me?foe:me;
      if(Math.abs(tg.x-b.x)<18&&tg.y>=GROUND-26)strike(b.own,tg,b.dmg||12,90,true,true);
    }
    if(b.fl>0)b.fl-=dt;
    return b.t<b.warn+.4;
  });
}
function updBeam(dt){
  const b=G.beam;if(!b)return;
  b.t+=dt;
  if(b.t>=.1&&!b.hit){
    b.hit=true;
    const a=b.own,o=a===me?foe:me;
    if((o.x-a.x)*b.dir>0&&o.y>GROUND-30){
      const r=strike(a,o,b.dmg,170,true,true,true);
      if(b.heal&&r&&r!=='block'){a.regen=(a.regen||0)+b.dmg*.8}
    }else G.words.push({x:o.x,y:GROUND-60,t:.7,max:.7,s:'ESQUIVÉ !',col:'#35e0ff'});
  }
  if(b.t>b.dur)G.beam=null;
}
function sep(a,b){
  if(Math.abs(a.y-b.y)>24||a.st==='ko'||b.st==='ko'||a.st==='down'||b.st==='down')return;
  const dx=b.x-a.x,m=17;
  if(Math.abs(dx)<m){const s=dx>=0?1:-1,push=(m-Math.abs(dx))/2;a.x-=s*push;b.x+=s*push;
    a.x=clamp(a.x,18,WORLD-18);b.x=clamp(b.x,18,WORLD-18)}
}
/* ===== pouvoirs des Stands (ultimes) et statuts ===== */
function after(t,fn){G.timers.push({t,fn})}
function fzApply(o,dur,col,type){
  o.frozen=dur;o.fzHits=0;o.fzCol=col;o.fzType=type;o.atk=null;o.guarding=false;o.vx=0;
  if(o.st==='atk'||o.st==='block'||o.st==='walk'||o.st==='jump')setSt(o,'idle');
  if(o.y<GROUND){o.y=GROUND;o.vy=0}
}
function thaw(a,o,dt){
  if(a.frozen<=0)return;
  a.frozen-=dt;
  if(a.frozen<=0){
    a.frozen=0;
    if(a.fzHits>0&&a.hp>0){
      a.fzHits=0;a.vx=(a.x>=o.x?1:-1)*150;a.vy=-210;setSt(a,'down',.9);
      G.hitstop=.1;G.shake=6;sfx.heavy();
      if(a.fzType==='ice')spark(a.x,a.y-26,'#d8f4ff',30);
    }
  }
}
function statusStep(a,dt){
  a.histT+=dt;
  if(a.histT>=.25){a.histT=0;a.hist.push(a.hp);if(a.hist.length>16)a.hist.shift()}
  if(a.specCd>0)a.specCd-=dt;
  if(a.counter>0)a.counter-=dt;
  if(a.shieldT>0)a.shieldT-=dt;
  if(a.haste>0){a.haste-=dt;
    if(Math.random()<dt*25)G.parts.push({x:a.x-a.f*8,y:a.y-rnd(4,44),vx:-a.f*60,vy:0,life:.25,max:.25,col:'#ffd23f',g:0,sz:2})}
  if(a.slow>0){a.slow-=dt;
    if(Math.random()<dt*10)G.parts.push({x:a.x+rnd(-8,8),y:a.y-rnd(4,48),vx:0,vy:-20,life:.5,max:.5,col:'#8a5ac8',g:0,sz:2})}
  if(a.poison>0){
    a.poison-=dt;
    if(a.hp>1){
      const dd=Math.min(a.hp-1,a.dps*dt);a.hp-=dd;
      const pb=a.poisonBy;if(pb&&pb.hp>0)pb.hp=Math.min(pb.max,pb.hp+dd*.5);
    }
    if(Math.random()<dt*14)G.parts.push({x:a.x+rnd(-8,8),y:a.y-rnd(4,48),vx:0,vy:-25,life:.5,max:.5,col:'#7aff6a',g:0,sz:2});
  }
  if(a.regen>0){
    const g=Math.min(a.regen,70*dt);a.hp=Math.min(a.max,a.hp+g);a.regen-=g;
    if(Math.random()<dt*20)G.parts.push({x:a.x+rnd(-8,8),y:a.y-rnd(4,48),vx:0,vy:-30,life:.5,max:.5,col:'#7affd0',g:0,sz:2});
  }
  if(a.frozen>0&&a.fzType==='stun'&&Math.random()<dt*30)spark(a.x+rnd(-10,10),a.y-rnd(4,50),'#fff27a',2);
}

const POWERS={
  freeze(a,o,p){
    if(p.type==='time'){
      G.timeStop=p.dur;G.tsOwner=a;G.tsTick=0;a.boost=p.dur;a.gauge=100;
      fzApply(o,p.dur,'#78c8ff','time');sfx.zawarudo();G.flash=.35;
    }else if(p.type==='skip'){
      a.boost=p.dur;a.gauge=100;fzApply(o,p.dur,'#d8c8ff','skip');sfx.zawarudo();G.flash=.5;ghost(a);
    }else if(p.type==='ice'){
      fzApply(o,p.dur,'#9fe8ff','ice');sfx.block();spark(o.x,o.y-26,'#d8f4ff',26);G.flash=.2;
    }else{
      fzApply(o,p.dur,'#fff27a','stun');sfx.bolt();G.flash=.25;
    }
  },
  beam(a,o,p){
    sfx.beam();G.shake=6;
    G.beam={own:a,t:0,dur:.8,hit:false,dir:a.f,col:p.col||'#ff2e93',h:p.h||1,dmg:p.dmg*pwr(a),heal:!!p.heal};
  },
  rewind(a,o,p){
    const old=a.hist.length?a.hist[0]:a.hp;
    const tgt=Math.min(a.max,Math.max(old+20,a.hp+30));
    a.regen+=Math.max(0,tgt-a.hp);
    ghost(a);G.flash=.3;sfx.charge();
    for(let i=0;i<3;i++)G.rings.push({x:a.x,y:a.y-26,r:34-i*10,t:.5,max:.5,col:'#ffe27a'});
    o.vx=(o.x>=a.x?1:-1)*140;
    if(o.frozen<=0){o.atk=null;setSt(o,'hurt',.45)}
  },
  heal(a,o,p){
    a.regen+=p.amt*2;a.gauge=100;sfx.stand();spark(a.x,a.y-26,'#7affd0',20);
    G.rings.push({x:a.x,y:a.y-4,r:6,t:.5,max:.5,col:'#7affd0'});
  },
  strike(a,o,p){
    const col=p.col||'#ffffff',pw=pwr(a);
    ghost(a);spark(a.x,a.y-24,col,16);sfx.dash();
    const side=o.f>0?1:-1;
    if(p.behind){
      a.x=clamp(o.x-side*32,22,WORLD-22);
      if(Math.abs(a.x-o.x)<18)a.x=clamp(o.x+side*32,22,WORLD-22);
    }else a.x=clamp(o.x+(a.x<o.x?-1:1)*38,22,WORLD-22);
    a.vy=0;a.y=Math.min(a.y,GROUND);a.f=o.x>a.x?1:-1;
    spark(a.x,a.y-24,col,16);ghost(a);setSt(a,'dash',.16);a.vx=0;
    const hits=p.hits||1;
    for(let i=0;i<hits;i++){
      const last=i===hits-1;
      after(.16+i*.13+(p.smash?.1:0),()=>{
        if(o.hp<=0||a.hp<=0||G.mode!=='fight')return;
        a.f=o.x>a.x?1:-1;
        if(Math.abs(o.x-a.x)>90)return;
        a.atk=ATK[last?2:i%2];a.dealt=true;setSt(a,'atk',a.atk.w+a.atk.a+a.atk.r);sfx.swing();
        const dmg=(last&&!p.smash?p.dmg*1.8:p.dmg)*pw;
        const r=strike(a,o,dmg,last?160:30,last,last||!!p.smash,true);
        if(p.smash&&r){G.shake=9;G.hitstop=.2;dust(o.x,GROUND,12);G.rings.push({x:o.x,y:GROUND-2,r:6,t:.4,max:.4,col:col})}
      });
    }
  },
  crush(a,o,p){
    for(let i=0;i<4;i++)G.rings.push({x:o.x,y:o.y-4,r:4+i*8,t:.5,max:.5,col:'#b8b8ff'});
    spark(o.x,GROUND-20,'#b8b8ff',24);sfx.heavy();G.shake=7;
    const r=strike(a,o,p.dmg*pwr(a),0,false,true,true);
    if(r&&r!=='ko'&&o.hp>0&&o.frozen<=0){o.vx=0;o.vy=0;o.y=GROUND;o.atk=null;setSt(o,'down',1.8)}
  },
  volley(a,o,p){
    for(let i=0;i<p.cnt;i++)after(.12*i,()=>{
      if(a.hp<=0||G.mode!=='fight')return;
      sfx.rush();
      G.proj.push({x:a.x+a.f*14,y:GROUND-34+rnd(-10,8),vx:a.f*170,vy:rnd(-50,50),home:true,r:5,
        dmg:p.dmg*pwr(a),col:p.col,own:a,life:3.2});
    });
  },
  wave(a,o,p){
    sfx.beam();G.shake=4;
    G.proj.push({x:a.x+a.f*14,y:GROUND-8,vx:a.f*190,r:10,dmg:p.dmg*pwr(a),col:p.col,own:a,life:2.6,wave:true});
  },
  barrage(a,o,p){
    if(p.pull){
      ghost(o);o.x=clamp(a.x+a.f*34,22,WORLD-22);o.vx=0;o.y=GROUND;o.vy=0;
      if(o.frozen<=0){o.atk=null;setSt(o,'hurt',.45)}
      spark(o.x,o.y-26,'#ffffff',14);sfx.stand();
    }else{
      ghost(a);a.x=clamp(o.x-(o.x>a.x?1:-1)*40,22,WORLD-22);spark(a.x,a.y-26,'#ffffff',14);sfx.dash();
    }
    a.f=o.x>a.x?1:-1;a.standOn=true;startRush(a,true);
  },
  counter(a,o,p){a.counter=p.dur;a.cMult=p.mult;a.gauge=100;sfx.stand();spark(a.x,a.y-26,'#ffffff',16)},
  haste(a,o,p){a.haste=p.dur;sfx.dash();ghost(a);spark(a.x,a.y-26,'#ffd23f',16)},
  poison(a,o,p){o.poison=p.dur;o.poisonBy=a;o.dps=(p.dps||3)*1.8;sfx.stand();spark(o.x,o.y-26,'#7aff6a',20)},
  slow(a,o,p){o.slow=p.dur;sfx.charge();spark(o.x,o.y-26,'#8a5ac8',20);G.rings.push({x:o.x,y:o.y-26,r:8,t:.5,max:.5,col:'#8a5ac8'})},
  shield(a,o,p){a.inv=Math.max(a.inv,p.dur);a.shieldT=p.dur;a.gauge=100;sfx.stand();spark(a.x,a.y-26,'#ffffff',16)},
  bolt(a,o,p){
    for(let i=0;i<p.cnt;i++)after(i*.5,()=>{
      if(a.hp<=0||G.mode!=='fight')return;
      G.bolts.push({x:o.x,t:0,warn:.65,own:a,hit:false,fl:0,dmg:p.dmg*pwr(a)});sfx.charge();
    });
  }
};

/* ===== attaques spéciales (une par combattant, avec temps de recharge) ===== */
const SPEC_DESC={
  knife:'projectile rapide',orb:"boule d'énergie",fan:'trois projectiles en éventail',
  bomb:'projectile en arc qui explose au sol',mine:'piège posé au sol, déclenché au contact',
  charge:'charge en avant',uppercut:'coup montant qui touche aussi en l\'air',
  mend:'soigne un peu',blink:"téléportation dans le dos de l'adversaire"
};
function dmgScaleOf(a){return pwr(a)}
function throwPose(a){a.atk=ATK[1];a.dealt=true;a.queued=false;setSt(a,'atk',.26);a.vx*=.3;sfx.swing()}
const SPEC={
  knife(a,o,p){
    throwPose(a);
    const mk=(k)=>({x:a.x+a.f*12,y:a.y-30+k*0,vx:a.f*340,vy:0,r:3,dmg:p.dmg*dmgScaleOf(a)*(a.d.name==='CRONOS'?.7:1),col:p.col,own:a,life:1.4,knife:true});
    G.proj.push(mk(0));
    if(a.d.name==='CRONOS')[1,2].forEach(k=>after(k*.13,()=>{if(a.hp>0&&a.frozen<=0){sfx.swing();const q=mk(k);q.x=a.x+a.f*12;q.y=a.y-30+(k===1?-5:5);G.proj.push(q)}}));
  },
  orb(a,o,p){
    throwPose(a);
    G.proj.push({x:a.x+a.f*14,y:a.y-30,vx:a.f*170,vy:0,r:7,dmg:p.dmg*dmgScaleOf(a),col:p.col,own:a,life:3});
  },
  fan(a,o,p){
    throwPose(a);
    for(let i=-1;i<=1;i++)G.proj.push({x:a.x+a.f*12,y:a.y-30,vx:a.f*250,vy:i*46,r:3,dmg:p.dmg*dmgScaleOf(a),col:p.col,own:a,life:1.3});
  },
  bomb(a,o,p){
    throwPose(a);
    G.proj.push({x:a.x+a.f*10,y:a.y-30,vx:a.f*clamp(Math.abs(o.x-a.x)/.95,90,300),vy:-230,g:540,r:6,bomb:true,dmg:p.dmg*dmgScaleOf(a),col:p.col,own:a,life:3});
  },
  mine(a,o,p){

function mkLayer(w,h,fn){

function Rg(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}

function bandSky(g,cols,y0,y1,w){
  const n=cols.length,bh=(y1-y0)/n;
  for(let i=0;i<n;i++){
    const ya=Math.round(y0+i*bh),yb=Math.round(y0+(i+1)*bh);
    Rg(g,0,ya,w,yb-ya+1,cols[i]);
    if(i<n-1)for(let k=0;k<4;k++)for(let x=(k%2);x<w;x+=2)Rg(g,x,yb-1-k+ (k>1?0:0),1,1,cols[i+1]);
  }
}
function windows(g,x,y,w,h,r,cols,dens){
  for(let wy=y+4;wy<y+h-4;wy+=6)for(let wx=x+3;wx<x+w-4;wx+=5){
    if(r()<dens)Rg(g,wx,wy,2,3,cols[r()*cols.length|0]);
  }
}
function buildings(g,r,y,xs,minH,maxH,minW,maxW,col,edge,wins,dens,roofs){
  let x=xs;
  while(x<g.canvas.width+10){
    const w=minW+(r()*(maxW-minW)|0),h=minH+(r()*(maxH-minH)|0);
    Rg(g,x,y-h,w,h+40,col);
    Rg(g,x,y-h,w,1,edge);Rg(g,x+w-1,y-h,1,h+40,dk(col,.3));
    if(roofs&&r()<.5){Rg(g,x+3,y-h-6,2,6,col);Rg(g,x+2,y-h-8,4,2,col)}
    if(roofs&&r()<.3){Rg(g,x+w-9,y-h-5,7,5,col);Rg(g,x+w-9,y-h-5,7,1,edge)}
    windows(g,x,y-h,w,h,r,wins,dens);
    x+=w+(r()*3|0);
  }
}

/* ===== effets pseudo-3D : sol en perspective, brume, rayons, zoom caméra ===== */
const FXC=[['#ff4fa3','#35e0ff'],['#6aa8ff','#b9d4ff'],['#b56cff','#ff9ad8']];
const VPY=118;                          // ligne d'horizon (point de fuite)
function fx3dFloor(i,t,camX){
  const c=FXC[i%3];
  // dégradé de profondeur sur le sol
  const g=cx.createLinearGradient(0,GROUND-2,0,H);g.addColorStop(0,'rgba(10,4,28,0)');g.addColorStop(1,'rgba(10,4,28,.55)');
  cx.fillStyle=g;cx.fillRect(0,GROUND-2,W,H-GROUND+2);
  // lignes de fuite : positions monde → perspective vers le point de fuite (centre écran)
  const vpx=W/2,k=(H-VPY)/(GROUND-VPY);
  cx.lineWidth=1;cx.strokeStyle=c[0];
  for(let wx=-40;wx<=WORLD+40;wx+=32){
    const sx=wx-camX;if(sx<-260||sx>W+260)continue;
    const bx=vpx+(sx-vpx)*k;
    cx.globalAlpha=.34;cx.beginPath();cx.moveTo(Math.round(sx)+.5,GROUND);cx.lineTo(Math.round(bx)+.5,H);cx.stroke();
  }
  // lignes horizontales : espacement qui croît avec la proximité
  for(let n=0;n<7;n++){
    const z=((n+(t*.35)%1)/7);                 // 0 loin → 1 proche (défile doucement)
    const y=GROUND+Math.pow(z,1.7)*(H-GROUND);
    cx.globalAlpha=.12+z*.3;cx.strokeStyle=c[1];cx.beginPath();cx.moveTo(0,Math.round(y)+.5);cx.lineTo(W,Math.round(y)+.5);cx.stroke();
  }
  cx.globalAlpha=1;
  // liseré lumineux à la jonction mur/sol
  cx.globalAlpha=.5;rect(0,GROUND-1,W,1,c[1]);cx.globalAlpha=.18;rect(0,GROUND-3,W,2,c[0]);cx.globalAlpha=1;
}
function fx3dHaze(i){   // perspective atmosphérique : brume à l'horizon
  const c=FXC[i%3][0];
  const g=cx.createLinearGradient(0,96,0,GROUND);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,c);
  cx.globalAlpha=.16;cx.fillStyle=g;cx.fillRect(0,96,W,GROUND-96);cx.globalAlpha=1;
}
function fx3dShafts(i,t,camX){   // rayons de lumière en parallaxe
  cx.save();cx.globalCompositeOperation='lighter';
  for(let k=0;k<3;k++){
    const x=(60+k*150-camX*.12+Math.sin(t*.3+k)*8);
    const g=cx.createLinearGradient(x,0,x+50,H);g.addColorStop(0,'rgba(255,200,240,.10)');g.addColorStop(1,'rgba(255,200,240,0)');
    cx.fillStyle=g;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x+26,0);cx.lineTo(x+86,H);cx.lineTo(x+20,H);cx.closePath();cx.fill();
  }

}

function netOnPeers(ch){

    if(NET.started||NET.peerId){netLeft();return}
  }
  if(!NET.peerId&&others.length){NET.peerId=others[0].peer}
  const pr=NET.peerId&&others.find(p=>p.peer===NET.peerId);
  if(!pr){netStatus(NET.code?'Code '+NET.code+' · en attente d\'un adversaire…':'');return}

  const pk=q.pk;if(Number.isInteger(pk)&&pk>=0&&pk<ROSTER.length)NET.peerPick=pk;

  $('lcode').textContent=code;
  netStatus('Code '+code+' · en attente d\'un adversaire…');
  NET.unsub=NET.room.onPeers(netOnPeers);
  netSend();
}
function showLobbyBtns(show){
  $('lbtns').style.display=show?'flex':'none';$('lin').style.display=show?'':'none';
}
function newCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[Math.random()*A.length|0];return s}
/* ===== 8 : boucle, manches, commandes, menu ===== */
function startRound(){
  foe=mk(G.opps[G.round],true);
  Object.assign(me,{x:WORLD/2-100,y:GROUND,vx:0,vy:0,f:1,hp:Math.min(me.max,me.hp+Math.round(me.max*.3)),st:'idle',stT:0,atk:null,standOn:false,standT:0,
    frozen:0,inv:0,boost:0,comboN:0,comboT:0,guarding:false,queued:false,air:false,
    slow:0,haste:0,poison:0,counter:0,regen:0,shieldT:0,hist:[],histT:0,specCd:2,standHold:0});
  me.trail=me.hp;
  G.proj=[];G.bolts=[];G.beam=null;G.timeStop=0;G.tsOwner=null;G.slow=1;G.slowT=0;G.ghosts=[];G.timers=[];
  G.cam=WORLD/2-W/2;
  G.mode='intro';G.msg='MANCHE '+(G.round+1);G.sub=foe.d.name+' · '+foe.d.stand;G.msgT=1.9;sfx.gong();
}
function newGame(){
  me=mk(ROSTER[G.picked],false);G.round=0;
  const ids=ROSTER.map((_,i)=>i).filter(i=>i!==G.picked);
  for(let i=ids.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ids[i],ids[j]]=[ids[j],ids[i]]}
  G.opps=ids.filter(i=>i!==G.foePick).slice(0,ROUNDS).map(i=>ROSTER[i]);
  if(G.foePick!=null){G.opps=[ROSTER[G.foePick],...G.opps.slice(0,ROUNDS-1)]}
  startRound();
}
function endScreen(win){
  G.mode='over';G.won=win;
  const full=win&&G.round>=ROUNDS-1;
  $('endT').textContent=win?(full?'VICTOIRE !':'K.O. !'):'DÉFAITE';
  $('endS').textContent=win?(full?'Les trois porteurs de Stand sont à terre. Tu es le plus fort. Essaie un autre pouvoir !':'Manche gagnée. Un nouvel adversaire arrive.'):'Ton adversaire t\'a eu. Relève-toi et recommence la manche.';
  $('again').textContent=win?(full?'MENU':'MANCHE SUIVANTE'):'REVANCHE';
  $('end').hidden=false;
}
$('again').addEventListener('click',()=>{
  if(NET.on){netRematch();return}
  $('end').hidden=true;
  if(G.won){
    if(G.round>=ROUNDS-1){toMenu();return}
    G.round++;startRound();
  }else{me.hp=me.max;me.ult=0;startRound()}
});
function toMenu(){
  if(NET.on)netStop();
  $('again').textContent='CONTINUER';$('toSel').textContent='CHANGER DE COMBATTANT';
  G.mode='menu';G.round=0;previewFighters();document.body.classList.add('menu');
  $('end').hidden=true;
}
function previewFighters(){
  me=mk(ROSTER[G.picked],false);foe=mk(ROSTER[G.foePick!=null?G.foePick:(G.picked+7)%ROSTER.length],true);
  G.cam=0;me.x=112;foe.x=272;me.standOn=true;foe.standOn=true;me.standT=1;foe.standT=1;
}

function partsStep(dt){
  G.parts=G.parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;return p.life>0});
  G.words=G.words.filter(w=>(w.t-=dt)>0);
  G.rings=G.rings.filter(r=>{r.t-=dt;r.r+=dt*90;return r.t>0});
  G.bursts=G.bursts.filter(b=>(b.t-=dt)>0);
  G.ghosts=G.ghosts.filter(g=>(g.life-=dt)>0);
}
function clearEdges(){inp.jump=inp.hit=inp.rush=inp.spec=inp.dash=inp.ult=inp.stand=false}

function updCam(dt){
  let t=0;if(me&&foe&&G.mode!=='menu')t=clamp((me.x+foe.x)/2-W/2,0,WORLD-W);
  G.cam=lerp(G.cam,t,1-Math.exp(-dt*8));
}
function tick(rdt){
  G.t+=rdt;updCam(rdt);fx3dCamUpdate(rdt);netTick(rdt);
  if(G.shake>0)G.shake=Math.max(0,G.shake-rdt*26);
  if(G.flash>0)G.flash-=rdt;
  if(G.msgT>0)G.msgT-=rdt;
  if(G.slowT>0){G.slowT-=rdt;if(G.slowT<=0)G.slow=1}
  if(!me||!foe)return;
  if(G.mode==='menu'){me.t+=rdt;foe.t+=rdt;standStep(me,rdt);standStep(foe,rdt);partsStep(rdt);clearEdges();return}
  if(G.hitstop>0){G.hitstop-=rdt;return}
  const dt=rdt*G.slow*GAME_SPEED;
  partsStep(dt);
  const pairs=[[me,foe],[foe,me]];
  if(G.mode==='intro'){
    pairs.forEach(([a])=>{if(a.net){netGhostStep(dt);return}stepState(a,dt);standStep(a,dt)});
    if(G.msgT<=0){G.mode='fight';G.msg='COMBAT !';G.sub='';G.msgT=.7}
    clearEdges();
  }else if(G.mode==='fight'){
    thaw(me,foe,dt);if(!foe.net)thaw(foe,me,dt);
    updPlayer(me,foe,dt);if(foe.net)netGhostStep(dt);else updFoe(foe,me,dt);
    pairs.forEach(([a,o])=>{
      if(a.net)return;
      statusStep(a,dt);
      if(a.frozen>0)return;
      const d2=dt*(a.haste>0?1.5:1)*(a.slow>0?.55:1);
      stepState(a,d2);
      if(a.st==='atk')atkStep(a,o,d2);
      phys(a,d2);standStep(a,d2);
    });
    G.timers=G.timers.filter(tm=>{tm.t-=dt;if(tm.t<=0){tm.fn();return false}return true});
    if(foe.net)netSep();else sep(me,foe);updProj(dt);updBolts(dt);updBeam(dt);
    if(G.timeStop>0){
      G.timeStop-=dt;G.tsTick-=dt;
      if(G.tsTick<=0){sfx.tick();G.tsTick=.5}
      if(G.timeStop<=0){G.timeStop=0;G.tsOwner=null;G.msg='LE TEMPS REPART';G.msgT=1;G.sub=''}
    }
    musicTick(dt,G.round,foe.hp<foe.max*.5||me.hp<me.max*.3);
    $('ultk').classList.toggle('ready',me.ult>=100);$('ultk').classList.toggle('dim',me.ult<100);
    $('speck').classList.toggle('dim',me.specCd>0);$('standk').classList.toggle('on',!!me.standLock);$('rushk').classList.toggle('dim',me.gauge<25);
    if(me.hp<=0||foe.hp<=0){G.mode='ko';G.ko=2.1;G.msg='K.O.';G.msgT=2.1;G.sub=''}
  }else if(G.mode==='pose'){
    const c=G.castBy;if(c.net)netMute(()=>{c.t+=dt;c.stT+=dt;standStep(c,dt)});else{c.t+=dt;c.stT+=dt;standStep(c,dt)}
    if(foe.net&&c!==foe)netGhostStep(dt);G.pose-=rdt;
    if(G.pose<=0)finishUlt();
    clearEdges();
  }else if(G.mode==='wait'){
    me.t+=dt;standStep(me,dt);if(foe&&foe.net)netGhostStep(dt);clearEdges();
  }else if(G.mode==='ko'){
    pairs.forEach(([a])=>{if(a.net){netGhostStep(dt);return}stepState(a,dt);phys(a,dt);standStep(a,dt)});
    G.ko-=rdt;
    if(G.ko<=0){if(NET.on)netRoundEnd();else endScreen(foe.hp<=0)}
    clearEdges();
  }
}

/* ---------- commandes ---------- */
const HELD={left:1,right:1,guard:1,duck:1};
document.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k;
  const on=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
    el.classList.add('down');inp[k]=true;sndInit();if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume()};
  const off=e=>{el.classList.remove('down');if(HELD[k])inp[k]=false};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',
  KeyJ:'hit',KeyK:'rush',KeyI:'spec',KeyL:'ult',KeyS:'guard',ArrowDown:'duck',KeyC:'duck',ShiftLeft:'guard',KeyU:'dash',KeyE:'dash',KeyQ:'stand',KeyO:'stand'};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=KM[e.code];if(k){e.preventDefault();sndInit();inp[k]=true}});
addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=KM[e.code];if(k&&HELD[k])inp[k]=false});
['gesturestart','gesturechange','gestureend','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
let _lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-_lt<450&&!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault();_lt=n},{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{if(!e.target.closest('#grid,#select,#lobby'))e.preventDefault()},{passive:false});
addEventListener('blur',()=>{inp.left=inp.right=inp.guard=inp.duck=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){inp.left=inp.right=inp.guard=inp.duck=false}});

/* ---------- sélection du combattant ---------- */
function drawIcon(c,d){
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h)},o='#0d0718',h=d.hair,hs=d.hairStyle;
  R(0,0,24,24,dk(d.st.body,.6));R(0,15,24,9,dk(d.st.body,.35));
  g.globalAlpha=.45;R(15,2,7,7,d.st.glow);g.globalAlpha=1;
  R(3,18,18,6,o);R(4,19,16,5,d.coat||d.top);R(10,19,4,5,d.top);
  if(d.scarf)R(4,17,16,3,d.scarf);
  R(6,4,12,14,o);R(7,5,10,12,d.skin);R(7,14,10,3,dk(d.skin,.15));
  if(hs===5){R(6,5,12,2,h)}
  else if(hs===4){R(5,1,14,6,o);R(6,2,12,4,h);R(5,6,14,2,o);R(6,6,12,1,h)}
  else if(hs===6){R(10,0,4,6,o);R(11,0,2,5,h);R(7,4,10,2,o);R(8,5,8,1,h)}
  else{
    R(6,3,12,5,o);R(7,4,10,3,h);
    if(hs===3||hs===0){R(7,1,3,3,o);R(8,1,1,2,h);R(12,0,3,4,o);R(13,0,1,3,h)}
    if(hs===2||hs===1){R(4,5,3,12,o);R(5,6,1,10,h)}
  }
  R(9,10,3,2,'#fff');R(14,10,3,2,'#fff');R(10,10,2,2,o);R(15,10,2,2,o);R(10,15,5,1,dk(d.skin,.5));
}
const grid=$('grid');
function showInfo(d){
  $('infoName').textContent=d.name;
  $('infoStand').textContent='Stand : '+d.stand+'  ·  Ultime : '+d.ultName;
  $('infoPow').textContent=d.desc+' Spécial : '+d.sp.n+' ('+d.sp.desc+').';
}
G.foePick=null;G.tab=0;
const tabs=[...document.querySelectorAll('#tabs button')];
function refreshGrid(){
  [...grid.children].forEach((c,k)=>{c.classList.toggle('on',k===G.picked);c.classList.toggle('foe',k===G.foePick)});
  tabs.forEach((b,k)=>b.classList.toggle('on',k===G.tab));
  $('tabs').querySelector('[data-t="2"]').classList.toggle('on',G.foePick==null&&G.tab===1);
}
function pickFighter(i){
  if(G.tab===1){
    if(i===G.picked)return;
    G.foePick=i;previewFighters();showInfo(ROSTER[i]);refreshGrid();return;
  }
  G.picked=i;if(G.foePick===i)G.foePick=null;
  previewFighters();showInfo(ROSTER[i]);refreshGrid();
}
tabs.forEach(b=>b.addEventListener('click',()=>{
  const t=+b.dataset.t;
  if(t===2){G.foePick=null;G.tab=1;previewFighters()}else G.tab=t;
  refreshGrid();
}));
ROSTER.forEach((d,i)=>{
  const b=document.createElement('button');b.className='cell';b.setAttribute('aria-label',d.name);
  const c=document.createElement('canvas');c.width=24;c.height=24;drawIcon(c,d);
  const sp=document.createElement('span');sp.textContent=d.name.split(' ')[0];
  b.appendChild(c);b.appendChild(sp);
  b.addEventListener('click',()=>pickFighter(i));
  grid.appendChild(b);
});
refreshGrid();showInfo(ROSTER[0]);
const dBtns=[...document.querySelectorAll('#diff button')];
function setDiff(i){G.diff=i;dBtns.forEach((b,k)=>b.classList.toggle('on',k===i));try{localStorage.setItem('jojo-diff',String(i))}catch(e){}}
dBtns.forEach((b,k)=>b.addEventListener('click',()=>setDiff(k)));
try{const v=parseInt(localStorage.getItem('jojo-diff'),10);if(v>=0&&v<=2)setDiff(v)}catch(e){}
$('go').addEventListener('click',()=>{sndInit();document.body.classList.remove('menu');newGame()});
$('online').addEventListener('click',()=>{sndInit();$('lobby').hidden=false;$('lcode').textContent='';netStatus('Crée une partie et donne le code à ton ami, ou entre son code.');showLobbyBtns(true)});
$('lcreate').addEventListener('click',()=>{netJoin(newCode())});
$('ljoin').addEventListener('click',()=>{const c=$('lin').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==4){netStatus('Le code a 4 caractères.');return}netJoin(c)});
$('lcancel').addEventListener('click',()=>{const was=NET.on;netStop();$('lobby').hidden=true;if(was&&G.mode!=='menu')toMenu()});
$('toSel').addEventListener('click',toMenu);
$('snd').addEventListener('click',e=>{
  e.stopPropagation();sndInit();SND.on=!SND.on;$('snd').classList.toggle('off',!SND.on);
});

/* ---------- boucle ---------- */
buildBG();previewFighters();document.body.classList.add("menu");
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  tick(dt);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
